<!doctype html>
<html lang="fa">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
<link rel="stylesheet" href="css/qgis2web.css">
<link rel="stylesheet" href="css/fontawesome-all.min.css">
<link rel="stylesheet" href="css/leaflet-measure.css">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>

/* ================================================= */
/* صفحه */
/* ================================================= */

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

#map{
    width:100%;
    height:100vh;
}

/* ================================================= */
/* GPS */
/* ================================================= */

.user-location-marker{
    position:relative;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.user-location-arrow{
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:25px solid #4285F4;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));
    transform-origin:center center;
}

.user-location-dot{
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 0 2px #4285F4;
}

.user-accuracy{
    background:rgba(66,133,244,.12);
    border:1px solid rgba(66,133,244,.35);
}

/* ================================================= */
/* اطلاعات مسیر */
/* ================================================= */

.route-info-label{
    background:transparent !important;
    border:0 !important;
}

.route-info-box{
    background:rgba(255,255,255,.95);
    border:2px solid #0066ff;
    border-radius:9px;
    padding:5px 8px;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
    color:#222;
    white-space:nowrap;
    text-align:center;
    line-height:18px;
    box-shadow:0 2px 6px rgba(0,0,0,.30);
    direction:rtl;
}

/* ================================================= */
/* پیام ناوبری */
/* ================================================= */

.navigation-message-label{
    background:transparent !important;
    border:0 !important;
}

.navigation-message-box{
    background:rgba(255,255,255,.96);
    border:2px solid #555;
    border-radius:8px;
    padding:5px 9px;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
    color:#222;
    white-space:nowrap;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    direction:rtl;
}

/* ================================================= */
/* Popup مسیر */
/* ================================================= */

.routing-popup{
    direction:rtl;
    text-align:center;
    font-family:Arial,sans-serif;
    min-width:190px;
}

.routing-popup-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.routing-popup-buttons{
    display:flex;
    gap:7px;
    justify-content:center;
}

.routing-popup-button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    font-weight:bold;
    min-width:75px;
}

.routing-popup-button:active{
    transform:scale(.96);
}

.routing-car{
    background:#e8f0fe;
}

.routing-foot{
    background:#e8f5e9;
}

/* ================================================= */
/* KMZ */
/* ================================================= */

.kmz-info{
    direction:rtl;
    text-align:right;
    font-family:Arial;
    font-size:14px;
}

/* ================================================= */
/* مختصات */
/* ================================================= */

.coordinate-info{
    position:absolute;
    right:8px;
    bottom:8px;
    z-index:1000;
    min-width:auto;
    width:max-content;
    max-width:calc(100vw - 20px);
    background:rgba(255,255,255,.72);
    border:1px solid rgba(120,120,120,.45);
    border-radius:8px;
    padding:6px 9px;
    box-shadow:0 1px 5px rgba(0,0,0,.20);
    direction:ltr;
    text-align:left;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:18px;
    pointer-events:none;
    backdrop-filter:blur(2px);
}

.coordinate-row{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
    margin-right:10px;
}

.coordinate-label{
    font-weight:bold;
}

.coordinate-value{
    font-family:monospace;
}

/* ================================================= */
/* اندازه‌گیری */
/* ================================================= */

.leaflet-control-measure{
    max-width:280px;
    z-index:10000 !important;
}

.leaflet-control-measure-toggle{
    position:absolute !important;
    left:-10000px !important;
    top:auto !important;
}

.leaflet-control-measure-interaction{
    font-size:13px;
    direction:rtl;
    text-align:right;
    z-index:10001 !important;
}

/* ابزار Draw پیش‌فرض مخفی */
.leaflet-draw{
    display:none !important;
}

/* لایه‌ها کنترل پیش‌فرض مخفی */
.leaflet-control-layers{
    display:none !important;
}

.leaflet-control{
    touch-action:manipulation;
}

/* اندازه‌گیری در پایین راست */
.leaflet-bottom .leaflet-control-measure{
    margin-right:8px !important;
    margin-bottom:8px !important;
}

/* ================================================= */
/* ابزارهای بالای نقشه */
/* ================================================= */

.kmz-file-input{
    display:none !important;
}

.map-top-tool-control{
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:auto;
}

.map-top-tool-button{
    min-width:92px;
    height:38px;
    padding:0 10px;
    border:1px solid rgba(0,0,0,.25);
    border-radius:7px;
    background:rgba(255,255,255,.96);
    color:#222;
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
    white-space:nowrap;
}

.map-top-tool-button:active{
    background:#e9e9e9;
    transform:scale(.97);
}

.map-top-tool-submenu{
    display:none;
    margin-top:2px;
    width:185px;
    background:rgba(255,255,255,.98);
    border-radius:8px;
    padding:5px;
    box-shadow:0 3px 12px rgba(0,0,0,.35);
    direction:rtl;
}

.map-top-tool-submenu.open{
    display:block;
}

.map-top-tool-submenu button{
    display:block;
    width:100%;
    min-height:40px;
    margin:2px 0;
    border:0;
    border-radius:6px;
    background:#f2f2f2;
    color:#222;
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:bold;
    text-align:right;
    padding:7px 9px;
    cursor:pointer;
}

.map-top-tool-submenu button:active{
    background:#ddd;
}

.leaflet-control-map-tools-left,
.leaflet-control-map-tools-right{
    margin:0 !important;
}

.leaflet-control-map-tools-left{
    margin-top:6px !important;
}

.leaflet-control-map-tools-right{
    margin-top:6px !important;
}

/* ================================================= */
/* موبایل */
/* ================================================= */

@media(max-width:600px){

    .map-top-tool-button{
        min-width:88px;
        height:36px;
        font-size:12px;
    }

    .map-top-tool-submenu{
        width:175px;
        max-width:calc(100vw - 24px);
    }

    .coordinate-info{
        right:6px;
        bottom:6px;
        min-width:auto;
        width:max-content;
        font-size:11px;
        line-height:17px;
        padding:5px 7px;
    }

    .route-info-box{
        font-size:11px;
        line-height:16px;
        padding:4px 7px;
    }

    .routing-popup-button{
        min-width:70px;
        padding:9px 8px;
        font-size:12px;
    }

    .navigation-message-box{
        font-size:11px;
        padding:4px 7px;
    }

    .leaflet-control-measure{
        max-width:calc(100vw - 20px);
    }

    .leaflet-bottom .leaflet-control-measure{
        margin-right:6px !important;
        margin-bottom:8px !important;
    }
}

</style>

<title>نقشه شهری</title>

</head>

<body>

<div id="map"></div>

<div id="coordinateInfo" class="coordinate-info">

    <div class="coordinate-row">
        <span class="coordinate-label">E:</span>
        <span id="utmE" class="coordinate-value">---</span>
    </div>

    <div class="coordinate-row">
        <span class="coordinate-label">N:</span>
        <span id="utmN" class="coordinate-value">---</span>
    </div>

    <div class="coordinate-row">
        <span class="coordinate-label">Zone:</span>
        <span id="utmZone" class="coordinate-value">---</span>
    </div>

    <div class="coordinate-row">
        <span class="coordinate-label">Elev:</span>
        <span id="elevation" class="coordinate-value">---</span>
        <span> m</span>
    </div>

</div>

<script src="js/qgis2web_expressions.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/L.Control.Layers.Tree.min.js"></script>
<script src="js/leaflet.rotatedMarker.js"></script>
<script src="js/leaflet.pattern.js"></script>
<script src="js/leaflet-hash.js"></script>
<script src="js/Autolinker.min.js"></script>
<script src="js/rbush.min.js"></script>
<script src="js/labelgun.min.js"></script>
<script src="js/labels.js"></script>
<script src="js/leaflet-measure.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script src="data/Lmt1400_3637_1.js"></script>
<script src="data/TXT1400_3637_2.js"></script>

<script>

/* ================================================= */
/* MAP */
/* ================================================= */

var map=L.map('map',{
    zoomControl:false,
    maxZoom:28,
    minZoom:1
});

var hash=new L.Hash(map);

L.control.zoom({
    position:'topleft'
}).addTo(map);

/* ================================================= */
/* SATELLITE */
/* ================================================= */

var satellite=L.tileLayer(
    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    {
        maxZoom:28,
        maxNativeZoom:19,
        attribution:''
    }
).addTo(map);

/* ================================================= */
/* AUTOLINKER */
/* ================================================= */

var autolinker=new Autolinker({
    truncate:{
        length:30,
        location:'smart'
    }
});

/* ================================================= */
/* POPUP */
/* ================================================= */

function removeEmptyRowsFromPopupContent(content,feature){

    var tempDiv=document.createElement('div');

    tempDiv.innerHTML=content;

    var rows=tempDiv.querySelectorAll('tr');

    for(var i=0;i<rows.length;i++){

        var td=rows[i].querySelector(
            'td.visible-with-data'
        );

        var key=td?td.id:'';

        if(
            td &&
            td.classList.contains('visible-with-data') &&
            feature.properties[key]==null
        ){

            rows[i].parentNode.removeChild(rows[i]);

        }

    }

    return tempDiv.innerHTML;
}

/* ================================================= */
/* LMT */
/* ================================================= */

function pop_Lmt1400_3637_1(feature,layer){

    var popupContent=
        '<table>'+
        '<tr><td>'+
        (
            feature.properties['F_Class']!==null
            ?
            autolinker.link(
                String(feature.properties['F_Class'])
            )
            :
            ''
        )+
        '</td></tr>'+
        '<tr><td>'+
        (
            feature.properties['L_Type']!==null
            ?
            autolinker.link(
                String(feature.properties['L_Type'])
            )
            :
            ''
        )+
        '</td></tr>'+
        '</table>';

    layer.bindPopup(
        removeEmptyRowsFromPopupContent(
            popupContent,
            feature
        ),
        {
            maxHeight:400
        }
    );

    layer.on(
        'click',
        function(e){
            L.DomEvent.stopPropagation(e);
        }
    );
}

function style_Lmt1400_3637_1_0(){

    return{
        color:'rgba(232,113,141,1.0)',
        weight:1,
        fillOpacity:0,
        interactive:true
    };
}

var layer_Lmt1400_3637_1=new L.geoJson(
    json_Lmt1400_3637_1,
    {
        interactive:true,
        onEachFeature:pop_Lmt1400_3637_1,
        style:style_Lmt1400_3637_1_0
    }
).addTo(map);

/* ================================================= */
/* TXT */
/* ================================================= */

function pop_TXT1400_3637_2(feature,layer){

    var popupContent=
        '<table>'+
        '<tr><td>'+
        (
            feature.properties['Name']!==null
            ?
            autolinker.link(
                String(feature.properties['Name'])
            )
            :
            ''
        )+
        '</td></tr>'+
        '<tr><td>'+
        (
            feature.properties['Name_Class']!==null
            ?
            autolinker.link(
                String(feature.properties['Name_Class'])
            )
            :
            ''
        )+
        '</td></tr>'+
        '</table>';

    layer.bindPopup(
        removeEmptyRowsFromPopupContent(
            popupContent,
            feature
        ),
        {
            maxHeight:400
        }
    );

    layer.on(
        'click',
        function(e){
            L.DomEvent.stopPropagation(e);
        }
    );
}

function style_TXT1400_3637_2_0(){

    return{
        radius:4,
        color:'rgba(35,35,35,1.0)',
        weight:1,
        fill:true,
        fillOpacity:1,
        fillColor:'rgba(231,113,72,1.0)',
        interactive:true
    };
}

var layer_TXT1400_3637_2=new L.geoJson(
    json_TXT1400_3637_2,
    {
        interactive:true,
        onEachFeature:pop_TXT1400_3637_2,

        pointToLayer:function(feature,latlng){

            return L.circleMarker(
                latlng,
                style_TXT1400_3637_2_0()
            );
        }
    }
).addTo(map);

/* ================================================= */
/* اندازه‌گیری */
/* ================================================= */

var measureControl=new L.Control.Measure({

    position:'bottomright',

    primaryLengthUnit:'meters',

    secondaryLengthUnit:'kilometers',

    primaryAreaUnit:'sqmeters',

    secondaryAreaUnit:'hectares',

    activeColor:'#ff0000',

    completedColor:'#00a000',

    captureZIndex:10000

});

measureControl.addTo(map);

/* ================================================= */
/* BOUNDS */
/* ================================================= */

var bounds_group=new L.featureGroup([]);

bounds_group.addLayer(
    layer_Lmt1400_3637_1
);

bounds_group.addLayer(
    layer_TXT1400_3637_2
);

function setBounds(){

    if(bounds_group.getLayers().length){

        map.fitBounds(
            bounds_group.getBounds()
        );
    }
}

setBounds();

/* ================================================= */
/* LAYERS */
/* ================================================= */

var overlaysTree=[

    {
        label:
        '<img src="legend/TXT1400_3637_2.png" /> TXT1400_3637',
        layer:
        layer_TXT1400_3637_2
    },

    {
        label:
        '<img src="legend/Lmt1400_3637_1.png" /> Lmt1400_3637',
        layer:
        layer_Lmt1400_3637_1
    },

    {
        label:'Google Satellite',
        layer:satellite
    }

];

var layersControl=L.control.layers.tree(
    null,
    overlaysTree,
    {
        collapsed:true
    }
);

layersControl.addTo(map);

/* ================================================= */
/* KMZ */
/* ================================================= */

var kmzLayer=L.geoJSON(
    null,
    {

        style:function(){

            return{
                color:'#ff0000',
                weight:3,
                fillColor:'#ffff00',
                fillOpacity:.25
            };
        },

        pointToLayer:function(feature,latlng){

            return L.circleMarker(
                latlng,
                {
                    radius:7,
                    color:'#ff0000',
                    weight:2,
                    fillColor:'#ffff00',
                    fillOpacity:.8
                }
            );
        },

        onEachFeature:function(feature,layer){

            var name='';

            if(
                feature.properties &&
                feature.properties.name
            ){

                name=feature.properties.name;
            }

            if(name){

                layer.bindPopup(
                    '<div class="kmz-info">'+
                    '<b>نام:</b> '+
                    name+
                    '</div>'
                );
            }

            layer.on(
                'click',
                function(e){
                    L.DomEvent.stopPropagation(e);
                }
            );
        }
    }
).addTo(map);

/* ================================================= */
/* DRAW */
/* ================================================= */

var drawnItems=new L.FeatureGroup();

map.addLayer(drawnItems);

var drawControl=new L.Control.Draw({

    position:'topleft',

    draw:{

        polyline:{
            shapeOptions:{
                color:'#0066ff',
                weight:4
            }
        },

        polygon:{
            allowIntersection:false,
            showArea:true,

            shapeOptions:{
                color:'#008000',
                weight:3,
                fillOpacity:.25
            }
        },

        rectangle:false,
        circle:false,
        circlemarker:false,

        marker:{
            icon:new L.Icon.Default()
        }
    },

    edit:{
        featureGroup:drawnItems,
        remove:true
    }
});

var activeDrawHandler=null;

function stopActiveDraw(){

    if(activeDrawHandler){

        try{

            activeDrawHandler.disable();

        }catch(error){

            console.log(
                'Draw stop:',
                error
            );
        }

        activeDrawHandler=null;
    }
}

function activateDrawHandler(handler){

    stopLiveRoute();

    stopActiveDraw();

    activeDrawHandler=handler;

    handler.enable();
}

map.on(
    L.Draw.Event.DRAWSTOP,
    function(){

        activeDrawHandler=null;
    }
);

map.on(
    L.Draw.Event.EDITSTOP,
    function(){

        activeDrawHandler=null;
    }
);

map.on(
    L.Draw.Event.DELETESTOP,
    function(){

        activeDrawHandler=null;
    }
);

/* ================================================= */
/* CREATED */
/* ================================================= */

map.on(
    L.Draw.Event.CREATED,
    function(event){

        drawnItems.clearLayers();

        var layer=event.layer;

        drawnItems.addLayer(layer);

        layer.bindPopup(
            '<div class="kmz-info">'+
            '<b>عارضه رسم‌شده</b><br>'+
            'برای خروجی KMZ از بخش Add Data استفاده کنید.'+
            '</div>'
        );
    }
);

/* ================================================= */
/* XML */
/* ================================================= */

function escapeXml(value){

    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&apos;');
}

/* ================================================= */
/* GEOJSON TO KML */
/* ================================================= */

function geoJSONToKML(geojson){

    var kml=
        '<?xml version="1.0" encoding="UTF-8"?>'+
        '<kml xmlns="http://www.opengis.net/kml/2.2">'+
        '<Document>'+
        '<name>QGIS Web Map Export</name>';

    var features=geojson.features||[];

    features.forEach(function(feature){

        if(!feature.geometry)return;

        var props=feature.properties||{};

        var name=
            props.name||
            props.Name||
            props.NAME||
            'عارضه';

        kml+=
            '<Placemark>'+
            '<name>'+
            escapeXml(name)+
            '</name>';

        var geometry=feature.geometry;

        if(geometry.type==='Point'){

            var c=geometry.coordinates;

            kml+=
                '<Point><coordinates>'+
                c[0]+','+c[1]+',0'+
                '</coordinates></Point>';
        }

        else if(geometry.type==='MultiPoint'){

            geometry.coordinates.forEach(function(c){

                kml+=
                    '<Point><coordinates>'+
                    c[0]+','+c[1]+',0'+
                    '</coordinates></Point>';
            });
        }

        else if(geometry.type==='LineString'){

            kml+=
                '<LineString>'+
                '<tessellate>1</tessellate>'+
                '<coordinates>';

            geometry.coordinates.forEach(function(c){

                kml+=
                    c[0]+','+
                    c[1]+',0 ';
            });

            kml+=
                '</coordinates>'+
                '</LineString>';
        }

        else if(geometry.type==='MultiLineString'){

            geometry.coordinates.forEach(function(line){

                kml+=
                    '<LineString>'+
                    '<tessellate>1</tessellate>'+
                    '<coordinates>';

                line.forEach(function(c){

                    kml+=
                        c[0]+','+
                        c[1]+',0 ';
                });

                kml+=
                    '</coordinates>'+
                    '</LineString>';
            });
        }

        else if(geometry.type==='Polygon'){

            kml+=
                '<Polygon>'+
                '<tessellate>1</tessellate>';

            geometry.coordinates.forEach(
                function(ring,index){

                    kml+=
                        index===0
                        ?
                        '<outerBoundaryIs>'
                        :
                        '<innerBoundaryIs>';

                    kml+=
                        '<LinearRing>'+
                        '<coordinates>';

                    ring.forEach(function(c){

                        kml+=
                            c[0]+','+
                            c[1]+',0 ';
                    });

                    kml+=
                        '</coordinates>'+
                        '</LinearRing>'+
                        (
                            index===0
                            ?
                            '</outerBoundaryIs>'
                            :
                            '</innerBoundaryIs>'
                        );
                }
            );

            kml+='</Polygon>';
        }

        else if(geometry.type==='MultiPolygon'){

            geometry.coordinates.forEach(function(polygon){

                kml+=
                    '<Polygon>'+
                    '<tessellate>1</tessellate>';

                polygon.forEach(function(ring,index){

                    kml+=
                        index===0
                        ?
                        '<outerBoundaryIs>'
                        :
                        '<innerBoundaryIs>';

                    kml+=
                        '<LinearRing>'+
                        '<coordinates>';

                    ring.forEach(function(c){

                        kml+=
                            c[0]+','+
                            c[1]+',0 ';
                    });

                    kml+=
                        '</coordinates>'+
                        '</LinearRing>'+
                        (
                            index===0
                            ?
                            '</outerBoundaryIs>'
                            :
                            '</innerBoundaryIs>'
                        );
                });

                kml+='</Polygon>';
            });
        }

        kml+='</Placemark>';
    });

    kml+=
        '</Document>'+
        '</kml>';

    return kml;
}

/* ================================================= */
/* IMPORT KMZ / KML */
/* ================================================= */

function importKMZFile(file){

    if(!file)return;

    var fileName=
        file.name.toLowerCase();

    if(
        !fileName.endsWith('.kmz') &&
        !fileName.endsWith('.kml')
    ){

        alert(
            'لطفاً فایل KMZ یا KML انتخاب کنید.'
        );

        return;
    }

    var reader=new FileReader();

    reader.onload=function(e){

        var arrayBuffer=e.target.result;

        if(fileName.endsWith('.kmz')){

            JSZip.loadAsync(arrayBuffer)

            .then(function(zip){

                var kmlFile=null;

                Object.keys(zip.files).forEach(
                    function(path){

                        if(
                            !zip.files[path].dir &&
                            path.toLowerCase().endsWith('.kml') &&
                            !kmlFile
                        ){

                            kmlFile=
                                zip.files[path];
                        }
                    }
                );

                if(!kmlFile){

                    throw new Error(
                        'فایل KML داخل KMZ پیدا نشد.'
                    );
                }

                return kmlFile.async('text');
            })

            .then(function(kmlText){

                parseKML(
                    kmlText,
                    file.name
                );
            })

            .catch(function(error){

                console.error(error);

                alert(
                    'خطا در خواندن فایل KMZ.'
                );
            });

        }else{

            var decoder=
                new TextDecoder('utf-8');

            var kmlText=
                decoder.decode(
                    new Uint8Array(arrayBuffer)
                );

            parseKML(
                kmlText,
                file.name
            );
        }
    };

    reader.readAsArrayBuffer(file);
}

/* ================================================= */
/* PARSE KML */
/* ================================================= */

function parseKML(kmlText,fileName){

    try{

        var parser=new DOMParser();

        var kml=
            parser.parseFromString(
                kmlText,
                'text/xml'
            );

        var geojson=
            toGeoJSON.kml(kml);

        if(
            !geojson ||
            !geojson.features ||
            geojson.features.length===0
        ){

            alert(
                'در فایل KMZ عارضه قابل نمایش پیدا نشد.'
            );

            return;
        }

        kmzLayer.clearLayers();

        kmzLayer.addData(
            geojson
        );

        var bounds=
            kmzLayer.getBounds();

        if(bounds.isValid()){

            map.fitBounds(
                bounds,
                {
                    padding:[40,40]
                }
            );
        }

        alert(
            'فایل '+
            fileName+
            ' با موفقیت وارد شد.\n'+
            'تعداد عوارض: '+
            geojson.features.length
        );

    }catch(error){

        console.error(error);

        alert(
            'خطا در تبدیل KML به نقشه.'
        );
    }
}

/* ================================================= */
/* UTM */
/* ================================================= */

function latLonToUTM(lat,lon){

    var a=6378137.0;
    var eccSquared=0.00669438;
    var k0=.9996;

    var LongOrigin;
    var eccPrimeSquared;
    var N,T,C,A,M;

    var LatRad=
        lat*Math.PI/180;

    var LongRad=
        lon*Math.PI/180;

    var ZoneNumber=
        Math.floor((lon+180)/6)+1;

    if(
        lat>=56 &&
        lat<64 &&
        lon>=3 &&
        lon<12
    ){

        ZoneNumber=32;
    }

    if(
        lat>=72 &&
        lat<84
    ){

        if(lon>=0 && lon<9)
            ZoneNumber=31;

        else if(lon>=9 && lon<21)
            ZoneNumber=33;

        else if(lon>=21 && lon<33)
            ZoneNumber=35;

        else if(lon>=33 && lon<42)
            ZoneNumber=37;
    }

    LongOrigin=
        (ZoneNumber-1)*6-180+3;

    var LongOriginRad=
        LongOrigin*Math.PI/180;

    eccPrimeSquared=
        eccSquared/
        (1-eccSquared);

    N=
        a/
        Math.sqrt(
            1-
            eccSquared*
            Math.sin(LatRad)*
            Math.sin(LatRad)
        );

    T=
        Math.tan(LatRad)*
        Math.tan(LatRad);

    C=
        eccPrimeSquared*
        Math.cos(LatRad)*
        Math.cos(LatRad);

    A=
        Math.cos(LatRad)*
        (LongRad-LongOriginRad);

    M=
        a*
        (
            (1-eccSquared/4-
             3*eccSquared*eccSquared/64-
             5*eccSquared*eccSquared*eccSquared/256)
            *LatRad

            -

            (3*eccSquared/8+
             3*eccSquared*eccSquared/32+
             45*eccSquared*eccSquared*eccSquared/1024)
            *Math.sin(2*LatRad)

            +

            (15*eccSquared*eccSquared/256+
             45*eccSquared*eccSquared*eccSquared/1024)
            *Math.sin(4*LatRad)

            -

            (35*eccSquared*eccSquared*eccSquared/3072)
            *Math.sin(6*LatRad)
        );

    var UTMEasting=
        k0*N*
        (
            A+
            (1-T+C)*A*A*A/6+
            (5-18*T+T*T+
             72*C-
             58*eccPrimeSquared)
            *A*A*A*A*A/120
        )+
        500000;

    var UTMNorthing=
        k0*
        (
            M+
            N*Math.tan(LatRad)*
            (
                A*A/2+
                (5-T+9*C+4*C*C)
                *A*A*A*A/24+
                (61-58*T+T*T+
                 600*C-
                 330*eccPrimeSquared)
                *A*A*A*A*A*A/720
            )
        );

    if(lat<0){

        UTMNorthing+=10000000;
    }

    return{

        easting:UTMEasting,

        northing:UTMNorthing,

        zone:
            ZoneNumber+
            (lat>=0?'N':'S')
    };
}

/* ================================================= */
/* COORDINATES */
/* ================================================= */

function updateCoordinateInfo(
    lat,
    lon,
    elevation
){

    if(
        typeof lat!=='number' ||
        typeof lon!=='number'
    ){

        return;
    }

    var utm=
        latLonToUTM(
            lat,
            lon
        );

    document.getElementById(
        'utmE'
    ).textContent=
        utm.easting.toFixed(2);

    document.getElementById(
        'utmN'
    ).textContent=
        utm.northing.toFixed(2);

    document.getElementById(
        'utmZone'
    ).textContent=
        utm.zone;

    if(
        elevation!==null &&
        elevation!==undefined &&
        !isNaN(elevation)
    ){

        document.getElementById(
            'elevation'
        ).textContent=
            Number(elevation).toFixed(1);
    }
}

/* ================================================= */
/* ELEVATION */
/* ================================================= */

function getElevationFromService(
    lat,
    lon
){

    var now=Date.now();

    if(
        now-lastElevationRequest<
        30000
    ){

        return;
    }

    lastElevationRequest=now;

    fetch(
        'https://api.open-elevation.com/api/v1/lookup?locations='+
        lat+','+lon
    )
    .then(function(response){

        if(!response.ok){

            throw new Error(
                'Elevation HTTP '+
                response.status
            );
        }

        return response.json();
    })
    .then(function(data){

        if(
            data &&
            data.results &&
            data.results.length
        ){

            var elevation=
                data.results[0].elevation;

            if(
                elevation!==null &&
                elevation!==undefined
            ){

                currentElevation=
                    Number(elevation);

                updateCoordinateInfo(
                    lat,
                    lon,
                    currentElevation
                );
            }
        }
    })
    .catch(function(error){

        console.log(
            'Elevation error:',
            error
        );
    });
}

/* ================================================= */
/* BEARING */
/* ================================================= */

function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
){

    var dLon=
        (lon2-lon1)*
        Math.PI/180;

    var y=
        Math.sin(dLon)*
        Math.cos(
            lat2*Math.PI/180
        );

    var x=
        Math.cos(
            lat1*Math.PI/180
        )*
        Math.sin(
            lat2*Math.PI/180
        )
        -
        Math.sin(
            lat1*Math.PI/180
        )*
        Math.cos(
            lat2*Math.PI/180
        )*
        Math.cos(dLon);

    return(
        Math.atan2(y,x)*
        180/Math.PI+
        360
    )%360;
}

function startLiveLocation(){

    if(
        !navigator.geolocation
    ){

        alert(
            'GPS این دستگاه پشتیبانی نمی‌شود.'
        );

        return;
    }

    watchID=
        navigator.geolocation.watchPosition(

        function(position){

            var lat=
                position.coords.latitude;

            var lng=
                position.coords.longitude;

            var accuracy=
                position.coords.accuracy;

            currentGPSAccuracy=
                accuracy;

            var heading=
                position.coords.heading;

            var gpsAltitude=
                position.coords.altitude;

            if(
                gpsAltitude!==null &&
                !isNaN(gpsAltitude)
            ){

                currentElevation=
                    gpsAltitude;

            }else{

                getElevationFromService(
                    lat,
                    lng
                );
            }

            updateCoordinateInfo(
                lat,
                lng,
                currentElevation
            );

            if(
                (
                    heading===null ||
                    isNaN(heading)
                ) &&
                lastPosition
            ){

                heading=
                    calculateBearing(
                        lastPosition.lat,
                        lastPosition.lng,
                        lat,
                        lng
                    );
            }

            if(
                heading===null ||
                isNaN(heading)
            ){

                heading=0;
            }

            if(userMarker){

                userMarker.setLatLng(
                    [lat,lng]
                );

                userMarker.setIcon(
                    createUserIcon(
                        heading
                    )
                );

            }else{

                userMarker=
                    L.marker(
                        [lat,lng],
                        {
                            icon:
                                createUserIcon(
                                    heading
                                ),

                            zIndexOffset:1000
                        }
                    ).addTo(map);

                userMarker.bindPopup(
                    '🎯 موقعیت فعلی شما'
                );
            }

            if(accuracyCircle){

                accuracyCircle.setLatLng(
                    [lat,lng]
                );

                accuracyCircle.setRadius(
                    accuracy
                );

            }else{

                accuracyCircle=
                    L.circle(
                        [lat,lng],
                        {
                            radius:accuracy,
                            className:
                                'user-accuracy'
                        }
                    ).addTo(map);
            }

            map._userLocation=
                L.latLng(
                    lat,
                    lng
                );

            if(liveRouteActive){

                updateLiveNavigation();
            }

            lastPosition={
                lat:lat,
                lng:lng
            };

        },

        function(error){

            console.log(
                'GPS Error:',
                error
            );
        },

        {
            enableHighAccuracy:true,
            maximumAge:1000,
            timeout:10000
        }
    );
}

/* ================================================= */
/* DISTANCE POINT TO SEGMENT */
/* ================================================= */

function distancePointToSegment(
    p,
    a,
    b
){

    var latRad=
        p.lat*Math.PI/180;

    var metersPerLat=
        111320;

    var metersPerLng=
        111320*
        Math.cos(latRad);

    var px=
        p.lng*metersPerLng;

    var py=
        p.lat*metersPerLat;

    var ax=
        a.lng*metersPerLng;

    var ay=
        a.lat*metersPerLat;

    var bx=
        b.lng*metersPerLng;

    var by=
        b.lat*metersPerLat;

    var dx=bx-ax;
    var dy=by-ay;

    if(
        dx===0 &&
        dy===0
    ){

        return Math.sqrt(
            Math.pow(px-ax,2)+
            Math.pow(py-ay,2)
        );
    }

    var t=
        (
            (px-ax)*dx+
            (py-ay)*dy
        )/
        (
            dx*dx+
            dy*dy
        );

    t=
        Math.max(
            0,
            Math.min(1,t)
        );

    var closestX=
        ax+t*dx;

    var closestY=
        ay+t*dy;

    return Math.sqrt(
        Math.pow(
            px-closestX,
            2
        )+
        Math.pow(
            py-closestY,
            2
        )
    );
}

/* ================================================= */
/* DISTANCE TO ROUTE */
/* ================================================= */

function distanceFromGeoJSONRoute(
    point,
    geometry
){

    if(
        !geometry ||
        !geometry.coordinates
    ){

        return Infinity;
    }

    var coordinates=
        geometry.coordinates;

    var minimum=Infinity;

    for(
        var i=0;
        i<coordinates.length-1;
        i++
    ){

        var a=
            L.latLng(
                coordinates[i][1],
                coordinates[i][0]
            );

        var b=
            L.latLng(
                coordinates[i+1][1],
                coordinates[i+1][0]
            );

        var distance=
            distancePointToSegment(
                point,
                a,
                b
            );

        if(
            distance<minimum
        ){

            minimum=distance;
        }
    }

    return minimum;
}

/* ================================================= */
/* CALCULATE ROUTE */
/* ================================================= */

function calculateLiveRoute(
    firstRoute
){

    if(
        !liveRouteActive ||
        !liveDestination ||
        !map._userLocation ||
        isRoutingRequestRunning
    ){

        return;
    }

    var now=
        Date.now();

    if(
        !firstRoute &&
        now-lastRouteRequestTime<
        ROUTE_REQUEST_COOLDOWN
    ){

        return;
    }

    if(
        !firstRoute &&
        currentGPSAccuracy>
        MAX_ACCEPTABLE_GPS_ACCURACY
    ){

        return;
    }

    isRoutingRequestRunning=
        true;

    lastRouteRequestTime=
        now;

    var start=
        L.latLng(
            map._userLocation.lat,
            map._userLocation.lng
        );

    var end=
        liveDestination;

    var profile;
    var server;

    if(
        liveRoutingMode===
        'driving'
    ){

        profile=
            'driving';

        server=
            'https://routing.openstreetmap.de/routed-car';

    }else{

        profile=
            'foot';

        server=
            'https://routing.openstreetmap.de/routed-foot';
    }

    var url=
        server+
        '/route/v1/'+
        profile+'/' +
        start.lng+','+
        start.lat+';'+
        end.lng+','+
        end.lat+
        '?overview=full&geometries=geojson';

    fetch(url)

    .then(function(response){

        if(!response.ok){

            throw new Error(
                'HTTP '+
                response.status
            );
        }

        return response.json();
    })

    .then(function(data){

        isRoutingRequestRunning=
            false;

        if(!liveRouteActive)
            return;

        if(
            !data.routes ||
            data.routes.length===0
        ){

            alert(
                'برای این مقصد مسیر پیدا نشد.'
            );

            return;
        }

        var route=
            data.routes[0];

        lastRouteGeometry=
            route.geometry;

        lastRoutePosition=
            L.latLng(
                start.lat,
                start.lng
            );

        offRouteCount=0;

        if(liveRouteLayer){

            map.removeLayer(
                liveRouteLayer
            );

            liveRouteLayer=null;
        }

        if(routeInfoMarker){

            map.removeLayer(
                routeInfoMarker
            );

            routeInfoMarker=null;
        }

        liveRouteLayer=
            L.geoJSON(
                route.geometry,
                {
                    style:{
                        weight:6,
                        opacity:.85
                    }
                }
            ).addTo(map);

        var distance=
            route.distance/1000;

        var duration=
            Math.round(
                route.duration/60
            );

        var modeName=
            liveRoutingMode===
            'driving'
            ?
            '🚗 خودرو'
            :
            '🚶 پیاده';

        var coordinates=
            route.geometry.coordinates;

        if(
            coordinates &&
            coordinates.length>0
        ){

            var middleIndex=
                Math.floor(
                    coordinates.length/2
                );

            var middleCoordinate=
                coordinates[
                    middleIndex
                ];

            var routeInfoIcon=
                L.divIcon({

                    className:
                        'route-info-label',

                    html:
                        '<div class="route-info-box">'+
                        modeName+
                        '<br>'+
                        '📏 '+
                        distance.toFixed(2)+
                        ' km'+
                        ' &nbsp; | &nbsp; '+
                        '⏱ '+
                        duration+
                        ' دقیقه'+
                        '</div>',

                    iconSize:[150,58],

                    iconAnchor:[75,29]
                });

            routeInfoMarker=
                L.marker(
                    [
                        middleCoordinate[1],
                        middleCoordinate[0]
                    ],
                    {
                        icon:
                            routeInfoIcon,

                        interactive:false,

                        zIndexOffset:1000
                    }
                ).addTo(map);
        }

        if(firstRoute){

            map.fitBounds(
                liveRouteLayer.getBounds(),
                {
                    padding:[50,50]
                }
            );

        }else{

            showNavigationMessage(
                '✅ مسیر جدید محاسبه شد',
                1800
            );
        }
    })

    .catch(function(error){

        isRoutingRequestRunning=
            false;

        console.log(
            'Smart routing error:',
            error
        );

        if(firstRoute){

            alert(
                'خطا در دریافت مسیر.\n'+
                'لطفاً دوباره امتحان کنید.'
            );
        }
    });
}

/* ================================================= */
/* LIVE NAVIGATION */
/* ================================================= */

function updateLiveNavigation(){

    if(
        !liveRouteActive ||
        !map._userLocation ||
        !liveDestination
    ){

        return;
    }

    var current=
        map._userLocation;

    var distanceToDestination=
        map.distance(
            current,
            liveDestination
        );

    if(
        distanceToDestination<=
        DESTINATION_REACHED_DISTANCE
    ){

        liveRouteActive=
            false;

        if(liveRouteLayer){

            liveRouteLayer.setStyle({
                opacity:.45
            });
        }

        if(routeInfoMarker){

            map.removeLayer(
                routeInfoMarker
            );

            routeInfoMarker=null;
        }

        showNavigationMessage(
            '✅ به مقصد رسیدید',
            4000
        );

        return;
    }

    if(
        distanceToDestination<=
        DESTINATION_NEAR_DISTANCE
    ){

        showNavigationMessage(
            '📍 به مقصد نزدیک شدید',
            1800
        );
    }

    if(!lastRouteGeometry){

        calculateLiveRoute(
            false
        );

        return;
    }

    if(
        currentGPSAccuracy>
        MAX_ACCEPTABLE_GPS_ACCURACY
    ){

        return;
    }

    if(lastRoutePosition){

        var moved=
            map.distance(
                lastRoutePosition,
                current
            );

        if(
            moved<
            ROUTE_UPDATE_DISTANCE
        ){

            return;
        }
    }

    var distanceFromRoute=
        distanceFromGeoJSONRoute(
            current,
            lastRouteGeometry
        );

    if(
        distanceFromRoute<=
        OFF_ROUTE_DISTANCE
    ){

        offRouteCount=0;

        lastRoutePosition=
            L.latLng(
                current.lat,
                current.lng
            );

        return;
    }

    offRouteCount++;

    showNavigationMessage(
        '🔄 بررسی مسیر...',
        1200
    );

    if(
        offRouteCount<
        OFF_ROUTE_CONFIRMATIONS
    ){

        lastRoutePosition=
            L.latLng(
                current.lat,
                current.lng
            );

        return;
    }

    offRouteCount=0;

    lastRoutePosition=
        L.latLng(
            current.lat,
            current.lng
        );

    showNavigationMessage(
        '🔄 در حال اصلاح مسیر...',
        2500
    );

    calculateLiveRoute(
        false
    );
}

/* ================================================= */
/* STOP ROUTE */
/* ================================================= */

function stopLiveRoute(){

    liveRouteActive=
        false;

    liveRoutingMode=
        null;

    liveDestination=
        null;

    lastRoutePosition=
        null;

    lastRouteGeometry=
        null;

    offRouteCount=0;

    isRoutingRequestRunning=
        false;

    clearCurrentRoute();
}

function closeAllMapToolMenus(){

    document
        .querySelectorAll(
            '.map-top-tool-submenu'
        )
        .forEach(function(menu){

            menu.classList.remove(
                'open'
            );
        });
}

function toggleMapToolSubmenu(
    id
){

    var submenu=
        document.getElementById(id);

    if(!submenu)return;

    var wasOpen=
        submenu.classList.contains(
            'open'
        );

    closeAllMapToolMenus();

    if(!wasOpen){

        submenu.classList.add(
            'open'
        );
    }
}
