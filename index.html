<!doctype html>
<html lang="fa">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="initial-scale=1,user-scalable=no,
      maximum-scale=1,width=device-width">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
<link rel="stylesheet" href="css/L.Control.Locate.min.css">
<link rel="stylesheet" href="css/qgis2web.css">
<link rel="stylesheet" href="css/fontawesome-all.min.css">
<link rel="stylesheet" href="css/leaflet-search.css">
<link rel="stylesheet" href="css/leaflet.photon.css">
<link rel="stylesheet" href="css/leaflet-measure.css">

<style>

/* ============================= */
/* نقشه */
/* ============================= */

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

#map {
    width: 100%;
    height: 100vh;
}


/* ============================= */
/* دکمه‌های سمت چپ */
/* ============================= */

.mobile-control {
    margin-left: 8px !important;
    margin-top: 5px !important;
}

.mobile-button {
    width: 46px;
    height: 46px;

    border: 1px solid #999;
    border-radius: 8px;

    background: white;

    font-size: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
}

.mobile-button:active {
    transform: scale(0.95);
}


/* ============================= */
/* نشانگر آبی شبیه Google Maps */
/* ============================= */

.user-location-marker {
    position: relative;
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.user-location-arrow {

    width: 0;
    height: 0;

    border-left: 9px solid transparent;
    border-right: 9px solid transparent;

    border-bottom: 25px solid #4285F4;

    filter:
        drop-shadow(0px 1px 2px rgba(0,0,0,0.5));

    transform-origin: center center;
}

.user-location-dot {

    position: absolute;

    width: 10px;
    height: 10px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 0 2px #4285F4;
}


/* دایره اطراف موقعیت */

.user-accuracy {

    border-radius: 50%;

    background: rgba(66,133,244,0.12);

    border:
        1px solid rgba(66,133,244,0.35);
}


/* موبایل */

@media(max-width:600px){

    .mobile-button {

        width: 44px;
        height: 44px;

        font-size: 20px;
    }

    .leaflet-control {
        margin-left: 7px !important;
    }
}

</style>

<title>نقشه</title>

</head>


<body>

<div id="map"></div>


<script src="js/qgis2web_expressions.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/L.Control.Layers.Tree.min.js"></script>
<script src="js/L.Control.Locate.min.js"></script>
<script src="js/leaflet.rotatedMarker.js"></script>
<script src="js/leaflet.pattern.js"></script>
<script src="js/leaflet-hash.js"></script>
<script src="js/Autolinker.min.js"></script>
<script src="js/rbush.min.js"></script>
<script src="js/labelgun.min.js"></script>
<script src="js/labels.js"></script>
<script src="js/leaflet.photon.js"></script>
<script src="js/leaflet-measure.js"></script>
<script src="js/leaflet-search.js"></script>

<script src="data/Lmt1400_3637_1.js"></script>
<script src="data/TXT1400_3637_2.js"></script>


<script>

/* ================================================= */
/* ایجاد نقشه */
/* ================================================= */

var map = L.map('map', {

    zoomControl: false,

    maxZoom: 28,

    minZoom: 1

});


var hash = new L.Hash(map);


/* ================================================= */
/* Zoom */
/* ================================================= */

L.control.zoom({

    position: 'topleft'

}).addTo(map);


/* ================================================= */
/* Google Satellite */
/* ================================================= */

var satellite = L.tileLayer(

    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',

    {

        maxZoom: 28,

        maxNativeZoom: 19,

        attribution: ''

    }

).addTo(map);


/* ================================================= */
/* Autolinker */
/* ================================================= */

var autolinker = new Autolinker({

    truncate: {

        length: 30,

        location: 'smart'

    }

});


/* ================================================= */
/* Popup */
/* ================================================= */

function removeEmptyRowsFromPopupContent(content, feature) {

    var tempDiv = document.createElement('div');

    tempDiv.innerHTML = content;

    var rows = tempDiv.querySelectorAll('tr');

    for (var i = 0; i < rows.length; i++) {

        var td =
            rows[i].querySelector('td.visible-with-data');

        var key =
            td ? td.id : '';

        if (
            td &&
            td.classList.contains('visible-with-data') &&
            feature.properties[key] == null
        ) {

            rows[i].parentNode.removeChild(rows[i]);

        }

    }

    return tempDiv.innerHTML;

}


/* ================================================= */
/* لایه Lmt */
/* ================================================= */

function pop_Lmt1400_3637_1(feature, layer) {

    var popupContent =

        '<table>' +

        '<tr><td>' +

        (feature.properties['F_Class'] !== null
            ? autolinker.link(
                String(feature.properties['F_Class'])
              )
            : '') +

        '</td></tr>' +

        '<tr><td>' +

        (feature.properties['L_Type'] !== null
            ? autolinker.link(
                String(feature.properties['L_Type'])
              )
            : '') +

        '</td></tr>' +

        '</table>';


    var content =
        removeEmptyRowsFromPopupContent(
            popupContent,
            feature
        );


    layer.bindPopup(
        content,
        {maxHeight:400}
    );

}


function style_Lmt1400_3637_1_0() {

    return {

        color:'rgba(232,113,141,1.0)',

        weight:1,

        fillOpacity:0,

        interactive:true

    };

}


var layer_Lmt1400_3637_1 =

    new L.geoJson(

        json_Lmt1400_3637_1,

        {

            interactive:true,

            onEachFeature:
                pop_Lmt1400_3637_1,

            style:
                style_Lmt1400_3637_1_0

        }

    ).addTo(map);


/* ================================================= */
/* لایه TXT */
/* ================================================= */

function pop_TXT1400_3637_2(feature, layer) {

    var popupContent =

        '<table>' +

        '<tr><td>' +

        (feature.properties['Name'] !== null
            ? autolinker.link(
                String(feature.properties['Name'])
              )
            : '') +

        '</td></tr>' +

        '<tr><td>' +

        (feature.properties['Name_Class'] !== null
            ? autolinker.link(
                String(feature.properties['Name_Class'])
              )
            : '') +

        '</td></tr>' +

        '</table>';


    layer.bindPopup(

        removeEmptyRowsFromPopupContent(
            popupContent,
            feature
        ),

        {maxHeight:400}

    );

}


function style_TXT1400_3637_2_0() {

    return {

        radius:4,

        color:'rgba(35,35,35,1.0)',

        weight:1,

        fill:true,

        fillOpacity:1,

        fillColor:'rgba(231,113,72,1.0)',

        interactive:true

    };

}


var layer_TXT1400_3637_2 =

    new L.geoJson(

        json_TXT1400_3637_2,

        {

            interactive:true,

            onEachFeature:
                pop_TXT1400_3637_2,

            pointToLayer:function(
                feature,
                latlng
            ){

                return L.circleMarker(

                    latlng,

                    style_TXT1400_3637_2_0()

                );

            }

        }

    ).addTo(map);


/* ================================================= */
/* اندازه‌گیری */
/* ================================================= */

var measureControl =

    new L.Control.Measure({

        position:'topleft',

        primaryLengthUnit:'meters',

        secondaryLengthUnit:'kilometers',

        primaryAreaUnit:'sqmeters',

        secondaryAreaUnit:'hectares'

    });


measureControl.addTo(map);


document
.getElementsByClassName(
    'leaflet-control-measure-toggle'
)[0]
.innerHTML='';


document
.getElementsByClassName(
    'leaflet-control-measure-toggle'
)[0]
.className +=
    ' fas fa-ruler';


/* ================================================= */
/* محدوده نقشه */
/* ================================================= */

var bounds_group =

    new L.featureGroup([]);

bounds_group.addLayer(
    layer_Lmt1400_3637_1
);

bounds_group.addLayer(
    layer_TXT1400_3637_2
);


function setBounds(){

    if(
        bounds_group.getLayers().length
    ){

        map.fitBounds(
            bounds_group.getBounds()
        );

    }

}

setBounds();


/* ================================================= */
/* لایه‌ها */
/* ================================================= */

var overlaysTree = [

    {
        label:
        '<img src="legend/TXT1400_3637_2.png" /> TXT1400_3637',

        layer:
        layer_TXT1400_3637_2
    },

    {

        label:
        '<img src="legend/Lmt1400_3637_1.png" /> Lmt1400_3637',

        layer:
        layer_Lmt1400_3637_1
    },

    {

        label:
        'Google Satellite',

        layer:
        satellite

    }

];


L.control.layers.tree(

    null,

    overlaysTree,

    {

        collapsed:true

    }

).addTo(map);


/* ================================================= */
/* جستجو */
/* ================================================= */

map.addControl(

    new L.Control.Search({

        layer:
        layer_TXT1400_3637_2,

        initial:false,

        hideMarkerOnCollapse:true,

        propertyName:
        'Name_Class'

    })

);


/* ================================================= */
/* 📍 موقعیت زنده کاربر */
/* ================================================= */

var userMarker = null;

var accuracyCircle = null;

var watchID = null;

var lastPosition = null;


/* ================================================= */
/* آیکون کاربر */
/* ================================================= */

function createUserIcon(heading){

    var html =

        '<div class="user-location-marker">' +

        '<div class="user-location-arrow" ' +

        'style="transform:rotate(' +

        heading +

        'deg)">' +

        '</div>' +

        '<div class="user-location-dot"></div>' +

        '</div>';


    return L.divIcon({

        className:'',

        html:html,

        iconSize:[32,32],

        iconAnchor:[16,16]

    });

}


/* ================================================= */
/* محاسبه جهت حرکت */
/* ================================================= */

function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
){

    var dLon =
        (lon2-lon1) *
        Math.PI/180;


    var y =
        Math.sin(dLon) *
        Math.cos(
            lat2*Math.PI/180
        );


    var x =

        Math.cos(
            lat1*Math.PI/180
        ) *
        Math.sin(
            lat2*Math.PI/180
        )

        -

        Math.sin(
            lat1*Math.PI/180
        ) *
        Math.cos(
            lat2*Math.PI/180
        ) *
        Math.cos(dLon);


    var bearing =
        Math.atan2(y,x) *
        180/Math.PI;


    return(
        bearing+360
    ) % 360;

}


/* ================================================= */
/* دریافت موقعیت زنده */
/* ================================================= */

function startLiveLocation(){

    if(!navigator.geolocation){

        alert(
            'GPS این دستگاه پشتیبانی نمی‌شود.'
        );

        return;

    }


    watchID =

    navigator.geolocation.watchPosition(

        function(position){

            var lat =
                position.coords.latitude;

            var lng =
                position.coords.longitude;


            var accuracy =
                position.coords.accuracy;


            /* جهت GPS */

            var heading =
                position.coords.heading;


            /* اگر heading موجود نبود */

            if(
                heading === null &&
                lastPosition
            ){

                heading =
                    calculateBearing(

                        lastPosition.lat,

                        lastPosition.lng,

                        lat,

                        lng

                    );

            }


            if(
                heading === null ||
                isNaN(heading)
            ){

                heading = 0;

            }


            /* ============================= */
            /* حرکت نرم نشانگر */
            /* ============================= */

            if(userMarker){

                userMarker.setLatLng(

                    [lat,lng]

                );

                userMarker.setIcon(

                    createUserIcon(
                        heading
                    )

                );

            }

            else{

                userMarker =

                    L.marker(

                        [lat,lng],

                        {

                            icon:
                            createUserIcon(
                                heading
                            ),

                            zIndexOffset:1000

                        }

                    ).addTo(map);


                userMarker.bindPopup(
                    '📍 موقعیت فعلی شما'
                );

            }


            /* ============================= */
            /* دقت GPS */
            /* ============================= */

            if(accuracyCircle){

                accuracyCircle.setLatLng(

                    [lat,lng]

                );

                accuracyCircle.setRadius(
                    accuracy
                );

            }

            else{

                accuracyCircle =

                    L.circle(

                        [lat,lng],

                        {

                            radius:accuracy,

                            className:
                            'user-accuracy'

                        }

                    ).addTo(map);

            }


            /* ============================= */
            /* ذخیره موقعیت */
            /* ============================= */

            map._userLocation =

                L.latLng(
                    lat,
                    lng
                );


            lastPosition = {

                lat:lat,

                lng:lng

            };


        },

        function(error){

            console.log(
                'GPS Error:',
                error
            );

            alert(

                'دسترسی به موقعیت مکانی امکان‌پذیر نیست.\n\n' +

                'Location گوشی را فعال کنید.'

            );

        },

        {

            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:10000

        }

    );

}


startLiveLocation();


/* ================================================= */
/* دکمه 📍 */
/* ================================================= */

var locationControl =

    L.control({

        position:'topleft'

    });


locationControl.onAdd =

function(){

    var div =

        L.DomUtil.create(
            'div',
            'leaflet-control mobile-control'
        );


    div.innerHTML =

        '<button ' +

        'id="locationButton" ' +

        'class="mobile-button" ' +

        'title="موقعیت من">' +

        '📍' +

        '</button>';


    L.DomEvent.disableClickPropagation(div);


    return div;

};


locationControl.addTo(map);


/* ================================================= */
/* عملکرد دکمه موقعیت */
/* ================================================= */

document
.getElementById('locationButton')
.onclick=function(){

    if(!map._userLocation){

        alert(
            'در حال دریافت موقعیت شما...'
        );

        return;

    }


    map.setView(

        map._userLocation,

        18

    );

};


/* ================================================= */
/* 🚗🚶 مسیریابی */
/* ================================================= */

var routeLayer = null;

var destinationMarker = null;


/* ================================================= */
/* دکمه‌های مسیریابی */
/* ================================================= */

var routingControl =

    L.control({

        position:'topleft'

    });


routingControl.onAdd =

function(){

    var div =

        L.DomUtil.create(

            'div',

            'leaflet-control mobile-control'

        );


    div.innerHTML =

        '<button ' +

        'id="carRouteButton" ' +

        'class="mobile-button" ' +

        'title="مسیر خودرو">' +

        '🚗' +

        '</button>' +

        '<br>' +

        '<button ' +

        'id="footRouteButton" ' +

        'class="mobile-button" ' +

        'title="مسیر پیاده">' +

        '🚶' +

        '</button>';


    L.DomEvent.disableClickPropagation(div);


    return div;

};


routingControl.addTo(map);


/* ================================================= */
/* شروع مسیریابی */
/* ================================================= */

function startRouting(mode){

    if(!map._userLocation){

        alert(

            'ابتدا اجازه دسترسی به GPS را بدهید.'

        );

        return;

    }


    alert(

        'حالا روی مقصد موردنظر روی نقشه بزنید.'

    );


    map.once(

        'click',

        function(e){

            var start =
                map._userLocation;

            var end =
                e.latlng;


            /* مسیر قبلی */

            if(routeLayer){

                map.removeLayer(
                    routeLayer
                );

                routeLayer=null;

            }


            /* مقصد قبلی */

            if(destinationMarker){

                map.removeLayer(
                    destinationMarker
                );

                destinationMarker=null;

            }


            destinationMarker =

                L.marker(end)

                .addTo(map)

                .bindPopup(

                    mode === 'driving'

                    ? '🎯 مقصد خودرو'

                    : '🎯 مقصد پیاده'

                )

                .openPopup();


            var profile;

            var server;


            if(mode === 'driving'){

                profile='driving';

                server=
                'https://routing.openstreetmap.de/routed-car';

            }

            else{

                profile='foot';

                server=
                'https://routing.openstreetmap.de/routed-foot';

            }


            var url =

                server +

                '/route/v1/' +

                profile +

                '/' +

                start.lng +

                ',' +

                start.lat +

                ';' +

                end.lng +

                ',' +

                end.lat +

                '?overview=full&geometries=geojson';


            fetch(url)

            .then(function(response){

                if(!response.ok){

                    throw new Error(
                        'HTTP '+response.status
                    );

                }

                return response.json();

            })

            .then(function(data){

                if(
                    !data.routes ||
                    data.routes.length===0
                ){

                    alert(
                        'مسیر پیدا نشد.'
                    );

                    return;

                }


                var route =
                    data.routes[0];


                routeLayer =

                    L.geoJSON(

                        route.geometry,

                        {

                            style:{

                                weight:6

                            }

                        }

                    ).addTo(map);


                map.fitBounds(

                    routeLayer.getBounds(),

                    {

                        padding:[
                            40,
                            40
                        ]

                    }

                );


                var distance =

                    (
                        route.distance/1000
                    ).toFixed(2);


                var duration =

                    Math.round(

                        route.duration/60

                    );


                var modeName =

                    mode === 'driving'

                    ? '🚗 خودرو'

                    : '🚶 پیاده';


                alert(

                    modeName +

                    '\n\n📏 فاصله: ' +

                    distance +

                    ' کیلومتر' +

                    '\n⏱ زمان تقریبی: ' +

                    duration +

                    ' دقیقه'

                );

            })

            .catch(function(error){

                console.log(error);

                alert(

                    'خطا در دریافت مسیر.\n\n' +

                    'اتصال اینترنت را بررسی کنید.'

                );

            });

        }

    );

}


/* ================================================= */
/* خودرو */
/* ================================================= */

document

.getElementById(
    'carRouteButton'
)

.onclick=function(){

    startRouting(
        'driving'
    );

};


/* ================================================= */
/* پیاده */
/* ================================================= */

document

.getElementById(
    'footRouteButton'
)

.onclick=function(){

    startRouting(
        'foot'
    );

};

</script>

</body>
</html>
