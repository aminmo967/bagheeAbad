/* ================================================= */
/* حذف ردیف‌های خالی Popup */
/* ================================================= */

function removeEmptyRowsFromPopupContent(
    content,
    feature
){

    var tempDiv =
        document.createElement('div');

    tempDiv.innerHTML =
        content;

    var rows =
        tempDiv.querySelectorAll('tr');

    for(
        var i=0;
        i<rows.length;
        i++
    ){

        var td =
            rows[i].querySelector(
                'td.visible-with-data'
            );

        var key =
            td ? td.id : '';

        if(

            td &&

            td.classList.contains(
                'visible-with-data'
            ) &&

            feature.properties[key] == null

        ){

            rows[i]
                .parentNode
                .removeChild(rows[i]);

        }

    }

    return tempDiv.innerHTML;

}


/* ================================================= */
/* لایه Lmt1400 */
/* ================================================= */

function pop_Lmt1400_3637_1(
    feature,
    layer
){

    var popupContent =

        '<table>' +

        '<tr><td>' +

        (
            feature.properties['F_Class'] !== null

            ?

            autolinker.link(
                String(
                    feature.properties['F_Class']

            ''
        )

        +

        '</td></tr>' +

        '<tr><td>' +

        (
            feature.properties['L_Type'] !== null

            autolinker.link(
                String(
                    feature.properties['L_Type']
                )
            )

            :

            ''

        +

        '</td></tr>' +

        '</table>';


    var content =

        removeEmptyRowsFromPopupContent(
            popupContent,
            feature

    layer.bindPopup(

        content,

        {
            maxHeight:400

}


function style_Lmt1400_3637_1_0(){

}


var layer_Lmt1400_3637_1 =

/* ================================================= */
/* لایه TXT1400 */

function pop_TXT1400_3637_2(

){

var layer_TXT1400_3637_2 =

/* ================================================= */

var measureControl =

/* ================================================= */

var watchID = null;

/* ================================================= */
/* ساخت آیکون کاربر */
/* ================================================= */

function createUserIcon(heading){

    var html =

        '<div class="user-location-marker">' +

        '<div class="user-location-arrow" ' +

        'style="transform:rotate(' +

        heading +

        'deg)">' +

        '</div>' +

        '<div class="user-location-dot">' +

        '</div>' +

        '</div>';


    return L.divIcon({

        className:'',

        html:html,

        iconSize:[32,32],

        iconAnchor:[16,16]

    });

}


/* ================================================= */
/* محاسبه جهت حرکت */
/* ================================================= */

function calculateBearing(

    lat1,
    lon1,
    lat2,
    lon2

){

    var dLon =

        (
            lon2-lon1
        )

        *

        Math.PI/180;


    var y =

        Math.sin(dLon)

        *

        Math.cos(
            lat2*Math.PI/180
        );


    var x =

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.sin(
            lat2*Math.PI/180
        )

        -

        Math.sin(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.cos(dLon);


    var bearing =

        Math.atan2(y,x)

        *

        180/Math.PI;


    return (

        bearing+360

    ) % 360;

}


/* ================================================= */
/* شروع GPS زنده */
/* ================================================= */

function startLiveLocation(){

    if(!navigator.geolocation){

        alert(
            'GPS این دستگاه پشتیبانی نمی‌شود.'
        );

        return;

    }


    watchID =

        navigator.geolocation.watchPosition(

            function(position){

                var lat =
                    position.coords.latitude;

                var lng =
                    position.coords.longitude;

                var accuracy =
                    position.coords.accuracy;


                var heading =
                    position.coords.heading;


                /* ================================= */
                /* محاسبه جهت در صورت نبود heading */
                /* ================================= */

                if(

                    (
                        heading === null ||
                        isNaN(heading)
                    )

                    &&

                    lastPosition

                ){

                    heading =

                        calculateBearing(

                            lastPosition.lat,

                            lastPosition.lng,

                            lat,

                            lng

                        );

                }


                if(

                    heading === null ||
                    isNaN(heading)

                ){

                    heading=0;

                }


                /* ================================= */
                /* نشانگر کاربر */
                /* ================================= */

                if(userMarker){

                    userMarker.setLatLng(

                        [lat,lng]

                    );

                    userMarker.setIcon(

                        createUserIcon(
                            heading
                        )

                    );

                }

                else{

                    userMarker =

                        L.marker(

                            [lat,lng],

                            {

                                icon:
                                    createUserIcon(
                                        heading
                                    ),

                                zIndexOffset:
                                    1000

                            }

                        ).addTo(map);


                    userMarker.bindPopup(
                        '📍 موقعیت فعلی شما'
                    );

                }


                /* ================================= */
                /* دقت GPS */
                /* ================================= */

                if(accuracyCircle){

                    accuracyCircle.setLatLng(

                        [lat,lng]

                    );

                    accuracyCircle.setRadius(
                        accuracy
                    );

                }

                else{

                    accuracyCircle =

                        L.circle(

                            [lat,lng],

                            {

                                radius:
                                    accuracy,

                                className:
                                    'user-accuracy'

                            }

                        ).addTo(map);

                }


                /* ================================= */
                /* ذخیره موقعیت */
                /* ================================= */

                map._userLocation =

                    L.latLng(
                        lat,
                        lng
                    );


                /* ================================= */
                /* بررسی مسیریابی زنده */
                /* ================================= */

                if(

                    liveRouteActive

                ){

                    updateLiveNavigation();

                }


                lastPosition = {

                    lat:lat,

                    lng:lng

                };

            },


            function(error){

                console.log(
                    'GPS Error:',
                    error
                );

            },


            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );

}


startLiveLocation();

/* دکمه موقعیت من */

/* ================================================= */
/* کنترل مسیریابی زنده */
/* ================================================= */

var liveRoutingControl =

        position:'topleft'

liveRoutingControl.onAdd =

function(){

        L.DomUtil.create(

        );

        '<button ' +

        'id="liveCarButton" ' +

        'class="mobile-button" ' +

        '🚗' +

        '</button>' +

        '<br>' +

        '<button ' +

        'id="liveFootButton" ' +

        'class="mobile-button" ' +

        'title="مسیریابی زنده پیاده">' +

        '🚶' +

        '</button>' +

        '<br>' +

        '<button ' +

        'id="stopLiveRouteButton" ' +

        'class="mobile-button" ' +

        'title="پایان مسیریابی">' +

/* ================================================= */
/* شروع مسیریابی زنده */
/* ================================================= */

function startLiveRouting(mode){

    if(!map._userLocation){

        alert(

            'هنوز موقعیت GPS دریافت نشده است.'

        );

        return;

    }


    liveRoutingMode = mode;


    alert(

        'مقصد را روی نقشه انتخاب کنید.'

    );


    map.once(

        'click',

        function(e){

            liveDestination =
                e.latlng;


            liveRouteActive = true;


            lastRoutePosition = null;


            /* =============================== */
            /* مقصد */
            /* =============================== */

            if(liveDestinationMarker){

                map.removeLayer(
                    liveDestinationMarker
                );

            }


            liveDestinationMarker =

                L.marker(

                    liveDestination

                ).addTo(map);


            liveDestinationMarker.bindPopup(

                mode === 'driving'

                ?

                '🏁 مقصد خودرو'

                :

                '🏁 مقصد پیاده'

            );


            /* =============================== */
            /* محاسبه مسیر اولیه */
            /* =============================== */

            calculateLiveRoute(true);

        }

    );

}


/* ================================================= */
/* محاسبه مسیر زنده */
/* ================================================= */

function calculateLiveRoute(firstRoute){

    if(!liveRouteActive){

        return;

    }


    if(!liveDestination){

        return;

    }


    if(!map._userLocation){

        return;

    }


    if(isRoutingRequestRunning){

        return;

    }


    /*
       جلوگیری از ارسال درخواست زیاد
       به سرور مسیریابی
    */

    var now =
        Date.now();


    if(

        !firstRoute &&

        now-lastRouteRequestTime < 5000

    ){

        return;

    }


    isRoutingRequestRunning = true;

    lastRouteRequestTime = now;


    var start =
        map._userLocation;

    var end =
        liveDestination;


    var profile;

    var server;


    if(
        liveRoutingMode === 'driving'
    ){

        profile='driving';

        server =
            'https://routing.openstreetmap.de/routed-car';

    }

    else{

        profile='foot';

        server =
            'https://routing.openstreetmap.de/routed-foot';

    }


    var url =

        server +

        '/route/v1/' +

        profile +

        '/' +

        start.lng +

        ',' +

        start.lat +

        ';' +

        end.lng +

        ',' +

        end.lat +

        '?overview=full&geometries=geojson';


    fetch(url)

    .then(

        function(response){

            if(!response.ok){

                throw new Error(
                    'HTTP '+response.status
                );

            }

            return response.json();

        }

    )


    .then(

        function(data){

            isRoutingRequestRunning=false;


            if(!liveRouteActive){

                return;

            }


            if(

                !data.routes ||

                data.routes.length===0

            ){

                return;

            }


            var route =
                data.routes[0];


            /* =============================== */
            /* حذف مسیر قبلی */
            /* =============================== */

            if(liveRouteLayer){

                map.removeLayer(
                    liveRouteLayer
                );

            }


            /* =============================== */
            /* رسم مسیر جدید */
            /* =============================== */

            liveRouteLayer =

                L.geoJSON(

                    route.geometry,

                    {

                        style:{

                            weight:6,

                            opacity:0.85

                        }

                    }

                ).addTo(map);


            /* =============================== */
            /* ذخیره موقعیت */
            /* =============================== */

            lastRoutePosition =

                L.latLng(

                    start.lat,

                    start.lng

                );


            /* =============================== */
            /* اطلاعات مسیر */
            /* =============================== */

            var distance =

                route.distance / 1000;


            var duration =

                Math.round(
                    route.duration / 60
                );


            var modeName =

                liveRoutingMode === 'driving'

                ?

                '🚗 خودرو'

                :

                '🚶 پیاده';


            var info =

                modeName +

                '<br>' +

                '📏 ' +

                distance.toFixed(2) +

                ' کیلومتر' +

                ' &nbsp; | &nbsp; ' +

                '⏱ ' +

                duration +

                ' دقیقه';


            document
            .getElementById(
                'liveRouteInfo'
            )
            .innerHTML = info;


            document
            .getElementById(
                'liveRouteInfo'
            )
            .style.display =
                'block';


            /* =============================== */
            /* فقط در شروع مسیر روی کل مسیر زوم */
            /* =============================== */

            if(firstRoute){

                map.fitBounds(

                    liveRouteLayer.getBounds(),

                    {

                        padding:[
                            50,
                            50
                        ]

                    }

                );

            }

        }

    )


    .catch(

        function(error){

            isRoutingRequestRunning=false;

            console.log(
                'Live routing error:',
                error
            );

        }

    );

}


/* ================================================= */
/* بررسی تغییر موقعیت کاربر */
/* ================================================= */

function updateLiveNavigation(){

    if(!liveRouteActive){

        return;

    }


    if(!map._userLocation){

        return;

    }


    if(!lastRoutePosition){

        calculateLiveRoute(false);

        return;

    }


    var current =
        map._userLocation;


    var distanceMoved =

        map.distance(

            lastRoutePosition,

            current

        );


    /*
       هر 30 متر مسیر بررسی می‌شود.
    */

    if(

        distanceMoved >= 30

    ){

        calculateLiveRoute(false);

    }

}

document
.getElementById(
    'liveCarButton'
)
.onclick = function(){

    startLiveRouting(
        'driving'
    );

};

/* دکمه پیاده */

document
.getElementById(
    'liveFootButton'
)
.onclick = function(){

    startLiveRouting(
        'foot'
    );

};


/* ================================================= */
/* پایان مسیریابی */
/* ================================================= */

document
.getElementById(
    'stopLiveRouteButton'
)
.onclick = function(){

    liveRouteActive=false;

    liveRoutingMode=null;

    liveDestination=null;

    lastRoutePosition=null;


    if(liveRouteLayer){

        map.removeLayer(
            liveRouteLayer
        );

        liveRouteLayer=null;

    }


    if(liveDestinationMarker){

        map.removeLayer(
            liveDestinationMarker
        );

        liveDestinationMarker=null;

    }


    document
    .getElementById(
        'liveRouteInfo'
    )
    .style.display='none';

};
