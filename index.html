/* کنترل اصلی مخفی است چون از منوی خودمان استفاده می‌کنیم */

var kmzLayer =

            style:{

/* ===================================================== */
/* KML TO GEOJSON */
/* ===================================================== */

function parseKML(
    kmlText
){

    try{

        var parser =
            new DOMParser();

        var kml =
            parser.parseFromString(
                kmlText,
                'text/xml'
            );


        var geojson =
            toGeoJSON.kml(
                kml
            );


        kmzLayer.clearLayers();

        kmzLayer.addData(
            geojson
        );


        if(
            geojson.features &&
            geojson.features.length
        ){

            map.fitBounds(
                kmzLayer.getBounds()
            );

        }

    }

    catch(error){

        alert(
            'خطا در خواندن KML/KMZ'
        );

        console.error(
            error
        );

    }

}



/* ===================================================== */
/* IMPORT KMZ */
/* ===================================================== */

function importKMZFile(
    file
){

    var reader =
        new FileReader();


    reader.onload =
        function(e){

            var arrayBuffer =
                e.target.result;


            if(
                file.name
                    .toLowerCase()
                    .endsWith('.kml')
            ){

                var text =
                    new TextDecoder()
                        .decode(arrayBuffer);

                parseKML(
                    text
                );

                return;

            }


            JSZip
                .loadAsync(
                    arrayBuffer
                )
                .then(function(zip){

                    var kmlFile =
                        null;


                    Object.keys(zip.files)
                        .forEach(function(
                            filename
                        ){

                            if(
                                filename
                                    .toLowerCase()
                                    .endsWith('.kml')
                            ){

                                kmlFile =
                                    zip.files[
                                        filename
                                    ];

                            }

                        });


                    if(!kmlFile){

                        alert(
                            'فایل KML داخل KMZ پیدا نشد.'
                        );

                        return;

                    }


                    return kmlFile
                        .async('string');

                })
                .then(function(
                    kmlText
                ){

                    if(kmlText){

                        parseKML(
                            kmlText
                        );

                    }

                })
                .catch(function(
                    error
                ){

                    console.error(
                        error
                    );

                    alert(
                        'خطا در باز کردن KMZ'
                    );

                });

        };


    reader.readAsArrayBuffer(
        file
    );

}



/* ===================================================== */
/* EXPORT KMZ */
/* ===================================================== */

function geoJSONToKML(
    geojson
){

    var kml =
        '<?xml version="1.0" encoding="UTF-8"?>' +
        '<kml xmlns="http://www.opengis.net/kml/2.2">' +
        '<Document>';


    geojson.features.forEach(
        function(feature){

            if(
                !feature.geometry
            ){

                return;

            }


            var geometry =
                feature.geometry;


            if(
                geometry.type ===
                'Point'
            ){

                kml +=
                    '<Placemark>' +
                    '<Point><coordinates>' +
                    geometry.coordinates[0] +
                    ',' +
                    geometry.coordinates[1] +
                    ',0' +
                    '</coordinates></Point>' +
                    '</Placemark>';

            }


            else if(
                geometry.type ===
                'LineString'
            ){

                var coords =
                    geometry.coordinates
                    .map(function(c){

                        return c[0] +
                            ',' +
                            c[1] +
                            ',0';

                    })
                    .join(' ');


                kml +=
                    '<Placemark>' +
                    '<LineString>' +
                    '<tessellate>1</tessellate>' +
                    '<coordinates>' +
                    coords +
                    '</coordinates>' +
                    '</LineString>' +
                    '</Placemark>';

            }


            else if(
                geometry.type ===
                'Polygon'
            ){

                var rings =
                    geometry.coordinates;


                kml +=
                    '<Placemark>' +
                    '<Polygon>' +
                    '<outerBoundaryIs>' +
                    '<LinearRing>' +
                    '<coordinates>';


                rings[0]
                    .forEach(function(c){

                        kml +=
                            c[0] +
                            ',' +
                            c[1] +
                            ',0 ';

                    });


                kml +=
                    '</coordinates>' +
                    '</LinearRing>' +
                    '</outerBoundaryIs>' +
                    '</Polygon>' +
                    '</Placemark>';

            }

        }
    );


    kml +=
        '</Document></kml>';


    return kml;

}



/* ===================================================== */
/* COLLECT EXPORT */
/* ===================================================== */

function collectExportGeoJSON(){

    var features=[];


    drawnItems.eachLayer(
        function(layer){

            var gj =
                layer.toGeoJSON();


            if(
                gj &&
                gj.geometry
            ){

                features.push(
                    gj
                );

            }

        }
    );


    kmzLayer.eachLayer(
        function(layer){

            var gj =
                layer.toGeoJSON();


            if(
                gj &&
                gj.geometry
            ){

                features.push(
                    gj
                );

            }

        }
    );


    return {

        type:'FeatureCollection',

        features:features

    };

}



/* ===================================================== */
/* EXPORT */
/* ===================================================== */

function exportKMZ(){

    var geojson =
        collectExportGeoJSON();


    if(
        !geojson.features.length
    ){

        alert(
            'هیچ عارضه‌ای برای خروجی وجود ندارد.'
        );

        return;

    }


    var kml =
        geoJSONToKML(
            geojson
        );


    var zip =
        new JSZip();


    zip.file(
        'doc.kml',
        kml
    );


    zip.generateAsync({

        type:'blob'

    }).then(function(blob){

        var url =
            URL.createObjectURL(
                blob
            );


        var a =
            document.createElement('a');


        a.href=url;

        a.download=
            'map_export.kmz';


        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    });

}

    return L.divIcon({

            30
        ],

        iconAnchor:[
            15,
            15
        ]

    });

}



/* ===================================================== */
/* BEARING */
/* ===================================================== */

function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
){

    var p1 =
        lat1 *
        Math.PI /
        180;


    var p2 =
        lat2 *
        Math.PI /
        180;


    var dl =
        (lon2-lon1) *
        Math.PI /
        180;


    var y =
        Math.sin(dl) *
        Math.cos(p2);


    var x =
        Math.cos(p1) *
        Math.sin(p2)
        -
        Math.sin(p1) *
        Math.cos(p2) *
        Math.cos(dl);


    var brng =
        Math.atan2(
            y,
            x
        ) *
        180 /
        Math.PI;


    return (
        brng+360
    ) % 360;

}



/* ===================================================== */
/* UTM */
/* ===================================================== */

function latLonToUTM(
    lat,
    lon
){

    var a=6378137.0;

    var eccSquared=0.00669438;

    var k0=0.9996;


    var LongOrigin;

    var eccPrimeSquared;

    var N;

    var T;

    var C;

    var A;

    var M;


    var ZoneNumber =
        Math.floor(
            (lon+180)/6
        )+1;


    /* Norway */

    if(
        lat>=56 &&
        lat<64 &&
        lon>=3 &&
        lon<12
    ){

        ZoneNumber=32;

    }


    /* Svalbard */

    if(
        lat>=72 &&
        lat<84
    ){

        if(
            lon>=0 &&
            lon<9
        )
            ZoneNumber=31;

        else if(
            lon>=9 &&
            lon<21
        )
            ZoneNumber=33;

        else if(
            lon>=21 &&
            lon<33
        )
            ZoneNumber=35;

        else if(
            lon>=33 &&
            lon<42
        )
            ZoneNumber=37;

    }


    LongOrigin =
        (ZoneNumber-1)*6-180+3;


    eccPrimeSquared =
        eccSquared /
        (1-eccSquared);


    var LatRad =
        lat *
        Math.PI /
        180;


    var LongRad =
        lon *
        Math.PI /
        180;


    var LongOriginRad =
        LongOrigin *
        Math.PI /
        180;


    N =
        a /
        Math.sqrt(
            1 -
            eccSquared *
            Math.sin(LatRad) *
            Math.sin(LatRad)
        );


    T =
        Math.tan(LatRad) *
        Math.tan(LatRad);


    C =
        eccPrimeSquared *
        Math.cos(LatRad) *
        Math.cos(LatRad);


    A =
        Math.cos(LatRad) *
        (
            LongRad -
            LongOriginRad
        );


    M =
        a *
        (
            (1 -
                eccSquared/4 -
                3*Math.pow(
                    eccSquared,
                    2
                )/64 -
                5*Math.pow(
                    eccSquared,
                    3
                )/256
            ) *
            LatRad

            -

            (
                3*eccSquared/8 +
                3*Math.pow(
                    eccSquared,
                    2
                )/32 +
                45*Math.pow(
                    eccSquared,
                    3
                )/1024
            ) *
            Math.sin(2*LatRad)

            +

            (
                15*Math.pow(
                    eccSquared,
                    2
                )/256 +

                45*Math.pow(
                    eccSquared,
                    3
                )/1024
            ) *
            Math.sin(4*LatRad)

            -

            (
                35*Math.pow(
                    eccSquared,
                    3
                )/3072
            ) *
            Math.sin(6*LatRad)
        );


    var UTMEasting =
        (
            k0*N*
            (
                A+
                (
                    1-T+C
                )*
                Math.pow(A,3)/6+

                (
                    5-
                    18*T+
                    T*T+
                    72*C-
                    58*eccPrimeSquared
                )*
                Math.pow(A,5)/120
            )
        )
        +500000.0;


    var UTMNorthing =
        (
            k0*
            (
                M+
                N*
                Math.tan(LatRad)*
                (
                    A*A/2+
                    (
                        5-T+
                        9*C+
                        4*C*C
                    )*
                    Math.pow(A,4)/24+

                    (
                        61-
                        58*T+
                        T*T+
                        600*C-
                        330*eccPrimeSquared
                    )*
                    Math.pow(A,6)/720
                )
            )
        );


    var hemisphere='N';


    if(lat<0){

        UTMNorthing +=
            10000000.0;

        hemisphere='S';

    }


    return {

        easting:UTMEasting,

        northing:UTMNorthing,

        zone:
            ZoneNumber+
            hemisphere

    };

}



/* ===================================================== */
/* UPDATE COORDINATE INFO */
/* ===================================================== */

function updateCoordinateInfo(
    lat,
    lon,
    elevation
){

    var utm =
        latLonToUTM(
            lat,
            lon
        );


    document.getElementById(
        'utmE'
    ).textContent =
        utm.easting.toFixed(2);


    document.getElementById(
        'utmN'
    ).textContent =
        utm.northing.toFixed(2);


    document.getElementById(
        'utmZone'
    ).textContent =
        utm.zone;


    if(
        elevation !== null &&
        elevation !== undefined &&
        !isNaN(elevation)
    ){

        document.getElementById(
            'elevation'
        ).textContent =
            Number(elevation).toFixed(1);

    }

}



/* ===================================================== */
/* ELEVATION SERVICE */
/* ===================================================== */

function getElevationFromService(
    lat,
    lon
){

    var now =
        Date.now();


    if(
        now-lastElevationRequest
        <
        30000
    ){

        return;

    }


    lastElevationRequest =
        now;


    fetch(
        'https://api.open-elevation.com/api/v1/lookup?locations=' +
        lat +
        ',' +
        lon
    )

    .then(function(response){

        return response.json();

    })

    .then(function(data){

        if(
            data.results &&
            data.results.length
        ){

            currentElevation =
                Number(
                    data.results[0].elevation
                );


            updateCoordinateInfo(
                lat,
                lon,
                currentElevation
            );

        }

    })

    .catch(function(){

        /* در صورت خطا مقدار قبلی حفظ می‌شود */

    });

}



/* ===================================================== */
/* GPS LOCATION */
/* ===================================================== */

function startLiveLocation(){

    if(
        !navigator.geolocation
    ){

        alert(
            'مرورگر شما از GPS پشتیبانی نمی‌کند.'
        );

        return;

    }


    if(
        watchID !== null
    ){

        navigator.geolocation.clearWatch(
            watchID
        );

    }


    watchID =
        navigator.geolocation.watchPosition(

            function(position){

                var lat =
                    position.coords.latitude;


                var lon =
                    position.coords.longitude;


                var accuracy =
                    position.coords.accuracy;


                var heading =
                    position.coords.heading;


                if(
                    heading === null ||
                    isNaN(heading)
                ){

                    if(lastPosition){

                        heading =
                            calculateBearing(

                                lastPosition.lat,

                                lastPosition.lon,

                                lat,

                                lon

                            );

                    }

                }


                if(
                    !Number.isFinite(
                        heading
                    )
                ){

                    heading=0;

                }


                lastPosition={

                    lat:lat,

                    lon:lon

                };


                map._userLocation =
                    L.latLng(
                        lat,
                        lon
                    );


                if(
                    userMarker === null
                ){

                    userMarker =
                        L.marker(

                            [lat,lon],

                            {

                                icon:
                                    createUserIcon(
                                        heading
                                    ),

                                zIndexOffset:1000

                            }

                        ).addTo(map);

                }

                else{

                    userMarker.setLatLng(
                        [lat,lon]
                    );


                    userMarker.setIcon(
                        createUserIcon(
                            heading
                        )
                    );

                }


                if(
                    accuracyCircle === null
                ){

                    accuracyCircle =
                        L.circle(

                            [lat,lon],

                            {

                                radius:accuracy,

                                color:'#1976d2',

                                fillColor:'#1976d2',

                                fillOpacity:0.12,

                                weight:1

                            }

                        ).addTo(map);

                }

                else{

                    accuracyCircle.setLatLng(
                        [lat,lon]
                    );

                    accuracyCircle.setRadius(
                        accuracy
                    );

                }


                var elevation =
                    position.coords.altitude;


                if(
                    elevation !== null &&
                    !isNaN(elevation)
                ){

                    currentElevation =
                        elevation;

                }

                else{

                    getElevationFromService(
                        lat,
                        lon
                    );

                }


                updateCoordinateInfo(
                    lat,
                    lon,
                    currentElevation
                );


                updateLiveNavigation();

            },


            function(error){

                if(
                    error.code === 1
                ){

                    alert(
                        'دسترسی به موقعیت مکانی رد شده است.'
                    );

                }

                else if(
                    error.code === 2
                ){

                    alert(
                        'موقعیت مکانی در دسترس نیست.'
                    );

                }

                else if(
                    error.code === 3
                ){

                    alert(
                        'زمان دریافت موقعیت به پایان رسید.'
                    );

                }

            },


            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );

}

/* ===================================================== */
/* COMPASS */
/* ===================================================== */

function startCompass(){

    if(
        typeof DeviceOrientationEvent !==
        'undefined' &&
        typeof DeviceOrientationEvent.requestPermission ===
        'function'
    ){

        DeviceOrientationEvent
            .requestPermission()
            .then(function(permission){

                if(
                    permission ===
                    'granted'
                ){

                    window.addEventListener(
                        'deviceorientation',
                        handleOrientation,
                        true
                    );

                }

            })

            .catch(function(){

                alert(
                    'دسترسی قطب‌نما داده نشد.'
                );

            });

    }

    else{

        window.addEventListener(
            'deviceorientation',
            handleOrientation,
            true
        );

    }

}


function handleOrientation(
    event
){

    var heading =
        event.webkitCompassHeading ||
        event.alpha;


    if(
        heading === null ||
        heading === undefined
    ){

        return;

    }


    if(userMarker){

        userMarker.setIcon(
            createUserIcon(
                heading
            )
        );

    }

}



/* ===================================================== */
/* ROUTING VARIABLES */
/* ===================================================== */

var liveRouteLayer=null;

var liveDestinationMarker=null;

var liveDestination=null;

var liveRoutingMode=null;

var liveRouteActive=false;

var lastRoutePosition=null;

var isRoutingRequestRunning=false;

var lastRouteRequestTime=0;


/* اطلاعات مسافت و زمان روی مسیر */

var routeInfoMarker=null;



/* ===================================================== */
/* START LIVE ROUTING */
/* ===================================================== */

function startLiveRouting(
    mode
){

    if(
        !map._userLocation
    ){

        alert(
            'ابتدا موقعیت مکانی خود را فعال کنید.'
        );

        return;

    }


    liveRoutingMode =
        mode;


    liveRouteActive =
        true;


    lastRoutePosition=null;


    if(
        liveDestinationMarker
    ){

        map.removeLayer(
            liveDestinationMarker
        );

        liveDestinationMarker=null;

    }


    if(
        routeInfoMarker
    ){

        map.removeLayer(
            routeInfoMarker
        );

        routeInfoMarker=null;

    }


    var modeText =
        mode === 'driving'
        ?
        '🚗 خودرو'
        :
        '🚶 پیاده';


    alert(
        modeText +
        ' - مقصد را روی نقشه انتخاب کنید.'
    );


    map.once(
        'click',
        function(e){

            liveDestination =
                e.latlng;


            liveDestinationMarker =
                L.marker(
                    liveDestination
                )
                .addTo(map)
                .bindPopup(
                    '🏁 مقصد ' +
                    (
                        mode ===
                        'driving'
                        ?
                        'خودرو'
                        :
                        'پیاده'
                    )
                )
                .openPopup();


            calculateLiveRoute(
                true
            );

        }
    );

}



/* ===================================================== */
/* CALCULATE LIVE ROUTE */
/* ===================================================== */

function calculateLiveRoute(
    firstRoute
){

    if(
        !liveRouteActive ||
        !map._userLocation ||
        !liveDestination
    ){

        return;

    }


    if(
        isRoutingRequestRunning
    ){

        return;

    }


    var now =
        Date.now();


    if(
        !firstRoute &&
        now-lastRouteRequestTime <
        5000
    ){

        return;

    }


    isRoutingRequestRunning=true;

    lastRouteRequestTime=now;


    var server;

    var profile;


    if(
        liveRoutingMode ===
        'driving'
    ){

        server =
            'https://routing.openstreetmap.de/routed-car';

        profile='driving';

    }

    else{

        server =
            'https://routing.openstreetmap.de/routed-foot';

        profile='foot';

    }


    var start =
        map._userLocation;


    var end =
        liveDestination;


    var url =
        server +
        '/route/v1/' +
        profile +
        '/' +
        start.lng +
        ',' +
        start.lat +
        ';' +
        end.lng +
        ',' +
        end.lat +
        '?overview=full&geometries=geojson';


    fetch(url)

    .then(function(response){

        return response.json();

    })

    .then(function(data){

        isRoutingRequestRunning=false;


        if(
            !data.routes ||
            !data.routes.length
        ){

            alert(
                'مسیر پیدا نشد.'
            );

            return;

        }


        var route =
            data.routes[0];


        /* حذف مسیر قبلی */

        if(
            liveRouteLayer
        ){

            map.removeLayer(
                liveRouteLayer
            );

            liveRouteLayer=null;

        }


        /* حذف برچسب قبلی */

        if(
            routeInfoMarker
        ){

            map.removeLayer(
                routeInfoMarker
            );

            routeInfoMarker=null;

        }


        /* رسم مسیر */

        liveRouteLayer =
            L.geoJSON(

                route.geometry,

                {

                    style:{

                        weight:6,

                        opacity:0.85

                    }

                }

            ).addTo(map);



        /* ================================================= */
        /* اطلاعات مسیر روی خود خط */
        /* ================================================= */

        var routeCoordinates =
            route.geometry.coordinates;


        if(
            routeCoordinates &&
            routeCoordinates.length > 0
        ){

            var middleIndex =
                Math.floor(
                    routeCoordinates.length / 2
                );


            var middleCoordinate =
                routeCoordinates[
                    middleIndex
                ];


            var distance =
                route.distance / 1000;


            var duration =
                Math.round(
                    route.duration / 60
                );


            var modeText =
                liveRoutingMode ===
                'driving'
                ?
                '🚗 خودرو'
                :
                '🚶 پیاده';


            var routeInfoIcon =
                L.divIcon({

                    className:
                        'route-info-label',

                    html:

                        '<div class="route-info-box">' +

                        modeText +

                        '<br>' +

                        '📏 ' +
                        distance.toFixed(2) +
                        ' km' +

                        ' &nbsp; | &nbsp; ' +

                        '⏱ ' +
                        duration +
                        ' دقیقه' +

                        '</div>',

                    iconSize:[
                        150,
                        58
                    ],

                    iconAnchor:[
                        75,
                        29
                    ]

                });


            routeInfoMarker =
                L.marker(

                    [

                        middleCoordinate[1],

                        middleCoordinate[0]

                    ],

                    {

                        icon:
                            routeInfoIcon,

                        interactive:false,

                        zIndexOffset:500

                    }

                ).addTo(map);

        }



        /* ================================================= */
        /* اطلاعات پایین صفحه */
        /* ================================================= */

        var info =
            document.getElementById(
                'liveRouteInfo'
            );


        info.innerHTML =

            (
                liveRoutingMode ===
                'driving'
                ?
                '🚗 مسیر خودرو'
                :
                '🚶 مسیر پیاده'
            )

            +

            ' &nbsp; | &nbsp; '

            +

            distance.toFixed(2)

            +

            ' km'

            +

            ' &nbsp; | &nbsp; '

            +

            duration

            +

            ' دقیقه';


        info.style.display =
            'block';



        lastRoutePosition =
            L.latLng(
                start.lat,
                start.lng
            );


        if(firstRoute){

            map.fitBounds(

                liveRouteLayer.getBounds(),

                {

                    padding:[
                        40,
                        40
                    ]

                }

            );

        }

    })

    .catch(function(error){

        isRoutingRequestRunning=false;

        console.error(
            error
        );

        alert(
            'خطا در دریافت مسیر.'
        );

    });

}



/* ===================================================== */
/* LIVE NAVIGATION */
/* ===================================================== */

function updateLiveNavigation(){

    if(
        !liveRouteActive ||
        !map._userLocation ||
        !lastRoutePosition
    ){

        return;

    }


    var current =
        map._userLocation;


    var distance =
        current.distanceTo(
            lastRoutePosition
        );


    /* هر 30 متر مسیر دوباره محاسبه شود */

    if(
        distance >= 30
    ){

        calculateLiveRoute(
            false
        );

    }

}



/* ===================================================== */
/* STOP ROUTE */
/* ===================================================== */

function stopLiveRoute(){

    liveRouteActive=false;

    liveRoutingMode=null;

    liveDestination=null;

    lastRoutePosition=null;


    if(
        liveRouteLayer
    ){

        map.removeLayer(
            liveRouteLayer
        );

        liveRouteLayer=null;

    }


    if(
        liveDestinationMarker
    ){

        map.removeLayer(
            liveDestinationMarker
        );

        liveDestinationMarker=null;

    }


    /* حذف اطلاعات روی مسیر */

    if(
        routeInfoMarker
    ){

        map.removeLayer(
            routeInfoMarker
        );

        routeInfoMarker=null;

    }


    var info =
        document.getElementById(
            'liveRouteInfo'
        );


    info.style.display='none';

}
