<style>

html,
body {
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

#map {
    width:100%;
    height:100vh;
}

/* ================================================= */
/* کنترل اصلی */
/* ================================================= */

.group-control {
    margin-left:8px !important;
    margin-top:5px !important;
    direction:ltr;
}

.group-main-button {
    width:46px;
    height:46px;
    border:1px solid #999;
    border-radius:9px;
    background:white;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
}

.group-main-button:active {
    transform:scale(0.95);
}

.group-menu {
    display:none;
    width:180px;
    margin-top:4px;
    background:rgba(255,255,255,0.97);
    border-radius:9px;
    padding:4px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
    box-sizing:border-box;
}

.group-menu.open {
    display:block;
}

.category-button {
    width:100% !important;
    min-height:45px !important;
    border:0 !important;
    border-bottom:1px solid #ddd !important;
    background:white !important;
    text-align:right !important;
    direction:rtl !important;
    padding:8px 10px !important;
    font-size:14px !important;
    cursor:pointer;
    border-radius:6px !important;
    font-weight:bold;
}

.category-button:active {
    background:#eee !important;
}

.group-submenu {
    display:none;
    margin:3px 0 5px 0;
}

.group-submenu.open {
    display:block;
}

.group-submenu button {
    width:165px;
    min-height:40px;
    margin:2px 0 2px 5px;
    border:0;
    background:#f3f3f3;
    text-align:right;
    direction:rtl;
    padding:7px 9px;
    font-size:13px;
    cursor:pointer;
    border-radius:5px;
}

.group-submenu button:active {
    background:#ddd;
}

.kmz-file-input {
    display:none;
}

/* ================================================= */
/* موقعیت کاربر */
/* ================================================= */

.user-location-marker {
    position:relative;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.user-location-arrow {
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:25px solid #4285F4;
    filter:drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
    transform-origin:center center;
}

.user-location-dot {
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 0 2px #4285F4;
}

.user-accuracy {
    background:rgba(66,133,244,0.12);
    border:1px solid rgba(66,133,244,0.35);
}

/* ================================================= */
/* اطلاعات مسیر */
/* ================================================= */

.route-info-label {
    background:transparent !important;
    border:0 !important;
}

.route-info-box {
    background:rgba(255,255,255,0.95);
    border:2px solid #0066ff;
    border-radius:9px;
    padding:5px 8px;
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;
    color:#222;
    white-space:nowrap;
    text-align:center;
    line-height:18px;
    box-shadow:0 2px 6px rgba(0,0,0,0.30);
    direction:rtl;
}

/* ================================================= */
/* Popup انتخاب مسیر */
/* ================================================= */

.routing-popup {
    direction:rtl;
    text-align:center;
    font-family:Arial,sans-serif;
    min-width:190px;
}

.routing-popup-title {
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.routing-popup-buttons {
    display:flex;
    gap:7px;
    justify-content:center;
}

.routing-popup-button {
    border:0;
    border-radius:7px;
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    font-weight:bold;
    min-width:75px;
}

.routing-popup-button:active {
    transform:scale(0.96);
}

.routing-car {
    background:#e8f0fe;
}

.routing-foot {
    background:#e8f5e9;
}

/* ================================================= */
/* اطلاعات KMZ */
/* ================================================= */

.kmz-info {
    direction:rtl;
    text-align:right;
    font-family:Arial;
    font-size:14px;
}

/* ================================================= */
/* دکمه‌های سمت راست */
/* ================================================= */

.map-side-control {
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:45px !important;
    margin-right:5px;
}

.map-side-button {
    width:44px;
    height:44px;
    border:1px solid #999;
    border-radius:9px;
    background:rgba(255,255,255,0.94);
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
    padding:0;
}

.map-side-button:active {
    transform:scale(0.94);
    background:#eee;
}

/* ================================================= */
/* کادر مختصات */
/* ================================================= */

.coordinate-info {
    position:absolute;
    right:8px;
    bottom:8px;
    z-index:1000;
    min-width:165px;
    background:rgba(255,255,255,0.72);
    border:1px solid rgba(120,120,120,0.45);
    border-radius:8px;
    padding:6px 9px;
    box-shadow:0 1px 5px rgba(0,0,0,0.20);
    direction:ltr;
    text-align:left;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:18px;
    pointer-events:none;
    backdrop-filter:blur(2px);
}

.coordinate-row {
    white-space:nowrap;
}

.coordinate-label {
    font-weight:bold;
}

.coordinate-value {
    font-family:monospace;
}

.leaflet-control-measure {
    display:none !important;
}

.leaflet-draw {
    display:none !important;
}

.leaflet-control-layers {
    display:none !important;
}

.leaflet-control {
    touch-action:manipulation;
}

/* ================================================= */
/* موبایل */
/* ================================================= */

@media(max-width:600px) {

    .group-control {
        margin-left:5px !important;
        margin-top:5px !important;
    }

    .group-main-button {
        width:44px;
        height:44px;
        font-size:19px;
    }

    .group-menu {
        width:180px;
        max-width:calc(100vw - 65px);
    }

    .category-button {
        width:100% !important;
        min-height:44px !important;
        font-size:14px !important;
    }

    .group-submenu button {
        width:160px;
        min-height:40px;
        font-size:13px;
    }

    .map-side-control {
    margin-top:45px !important;
    margin-right:5px;
}

    .map-side-button {

        height:42px;
        font-size:20px;
    }

    .coordinate-info {

    }

    .live-route-info {
        bottom:15px;
        font-size:13px;

    }

    .route-info-box {
        font-size:11px;
        line-height:16px;
        padding:4px 7px;
    }

        min-width:70px;
        padding:9px 8px;
        font-size:12px;

<script src="data/TXT1400_3637_2.js"></script>

<script>

/* ================================================= */
/* نقشه */
/* ================================================= */

var map = L.map('map', {
    zoomControl:false,
    maxZoom:28,
    minZoom:1
});

var hash = new L.Hash(map);

L.control.zoom({
    position:'topleft'
}).addTo(map);

/* ================================================= */
/* Google Satellite */
/* ================================================= */

var satellite = L.tileLayer(
    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    {
        maxZoom:28,
        maxNativeZoom:19,
        attribution:''
    }
).addTo(map);

/* ================================================= */
/* Autolinker */
/* ================================================= */

var autolinker = new Autolinker({
    truncate:{
        length:30,
        location:'smart'
    }
});

/* ================================================= */
/* Popup */
/* ================================================= */

function removeEmptyRowsFromPopupContent(content,feature){

    var tempDiv=document.createElement('div');

    tempDiv.innerHTML=content;

    var rows=tempDiv.querySelectorAll('tr');

    for(var i=0;i<rows.length;i++){

        var td=rows[i].querySelector(
            'td.visible-with-data'
        );

        var key=td ? td.id : '';

        if(
            td &&
            td.classList.contains('visible-with-data') &&
            feature.properties[key]==null
        ){

            rows[i].parentNode.removeChild(rows[i]);

        }

    }

    return tempDiv.innerHTML;

}

/* ================================================= */
/* Lmt1400 */
/* ================================================= */

function pop_Lmt1400_3637_1(feature,layer){

    var popupContent =
        '<table>' +

        '<tr><td>' +
        (
            feature.properties['F_Class'] !== null
            ?
            autolinker.link(
                String(feature.properties['F_Class'])
            )
            :
            ''
        ) +
        '</td></tr>' +

        '<tr><td>' +
        (
            feature.properties['L_Type'] !== null
            ?
            autolinker.link(
                String(feature.properties['L_Type'])
            )
            :
            ''
        ) +
        '</td></tr>' +

        '</table>';

    layer.bindPopup(
        removeEmptyRowsFromPopupContent(
            popupContent,
            feature
        ),
        {
            maxHeight:400
        }
    );

    /* جلوگیری از تبدیل کلیک روی عارضه به مقصد مسیر */

    layer.on(
        'click',
        function(e){

            L.DomEvent.stopPropagation(e);

        }
    );

}

function style_Lmt1400_3637_1_0(){

    return {
        color:'rgba(232,113,141,1.0)',
        weight:1,
        fillOpacity:0,
        interactive:true
    };

}

var layer_Lmt1400_3637_1 = new L.geoJson(
    json_Lmt1400_3637_1,
    {
        interactive:true,
        onEachFeature:pop_Lmt1400_3637_1,
        style:style_Lmt1400_3637_1_0
    }
).addTo(map);

/* ================================================= */
/* TXT1400 */
/* ================================================= */

function pop_TXT1400_3637_2(feature,layer){

    var popupContent =
        '<table>' +

        '<tr><td>' +
        (
            feature.properties['Name'] !== null
            ?
            autolinker.link(
                String(feature.properties['Name'])
            )
            :
            ''
        ) +
        '</td></tr>' +

        '<tr><td>' +
        (
            feature.properties['Name_Class'] !== null
            ?
            autolinker.link(
                String(feature.properties['Name_Class'])
            )
            :
            ''
        ) +
        '</td></tr>' +

        '</table>';

    layer.bindPopup(
        removeEmptyRowsFromPopupContent(
            popupContent,
            feature
        ),
        {
            maxHeight:400
        }
    );

    /* جلوگیری از تبدیل کلیک روی عارضه به مقصد مسیر */

    layer.on(
        'click',
        function(e){

            L.DomEvent.stopPropagation(e);

        }
    );

}

function style_TXT1400_3637_2_0(){

    return {
        radius:4,
        color:'rgba(35,35,35,1.0)',
        weight:1,
        fill:true,
        fillOpacity:1,
        fillColor:'rgba(231,113,72,1.0)',
        interactive:true
    };

}

var layer_TXT1400_3637_2 = new L.geoJson(
    json_TXT1400_3637_2,
    {
        interactive:true,
        onEachFeature:pop_TXT1400_3637_2,

        pointToLayer:function(feature,latlng){

            return L.circleMarker(
                latlng,
                style_TXT1400_3637_2_0()
            );

        }

    }
).addTo(map);

/* ================================================= */
/* اندازه‌گیری */
/* ================================================= */

var measureControl = new L.Control.Measure({

    position:'topright',

    primaryLengthUnit:'meters',

    secondaryLengthUnit:'kilometers',

    primaryAreaUnit:'sqmeters',

    secondaryAreaUnit:'hectares',

    activeColor:'#ff0000',

    completedColor:'#00a000'

});

measureControl.addTo(map);

/* ================================================= */
/* محدوده */
/* ================================================= */

var bounds_group = new L.featureGroup([]);

bounds_group.addLayer(
    layer_Lmt1400_3637_1
);

bounds_group.addLayer(
    layer_TXT1400_3637_2
);

function setBounds(){

    if(bounds_group.getLayers().length){

        map.fitBounds(
            bounds_group.getBounds()
        );

    }

}

setBounds();

/* ================================================= */
/* لایه‌ها */
/* ================================================= */

var overlaysTree = [

    {
        label:
        '<img src="legend/TXT1400_3637_2.png" /> TXT1400_3637',
        layer:
        layer_TXT1400_3637_2
    },

    {
        label:
        '<img src="legend/Lmt1400_3637_1.png" /> Lmt1400_3637',
        layer:
        layer_Lmt1400_3637_1
    },

    {
        label:
        'Google Satellite',
        layer:
        satellite
    }

];

var layersControl = L.control.layers.tree(
    null,
    overlaysTree,
    {
        collapsed:true
    }
);

layersControl.addTo(map);

/* ================================================= */
/* KMZ */
/* ================================================= */

var kmzLayer = L.geoJSON(
    null,
    {

        style:function(){

            return {
                color:'#ff0000',
                weight:3,
                fillColor:'#ffff00',
                fillOpacity:0.25
            };

        },

        pointToLayer:function(feature,latlng){

            return L.circleMarker(
                latlng,
                {
                    radius:7,
                    color:'#ff0000',
                    weight:2,
                    fillColor:'#ffff00',
                    fillOpacity:0.8
                }
            );

        },

        onEachFeature:function(feature,layer){

            var name='';

            if(
                feature.properties &&
                feature.properties.name
            ){

                name=feature.properties.name;

            }

            if(name){

                layer.bindPopup(
                    '<div class="kmz-info">' +
                    '<b>نام:</b> ' +
                    name +
                    '</div>'
                );

            }

            layer.on(
                'click',
                function(e){

                    L.DomEvent.stopPropagation(e);

                }
            );

        }

    }
).addTo(map);

/* ================================================= */
/* عوارض رسم‌شده */
/* ================================================= */

var drawnItems = new L.FeatureGroup();

map.addLayer(drawnItems);

/* ================================================= */
/* ابزار رسم */
/* ================================================= */

var drawControl = new L.Control.Draw({

    position:'topleft',

    draw:{

        polyline:{
            shapeOptions:{
                color:'#0066ff',
                weight:4
            }
        },

        polygon:{
            allowIntersection:false,
            showArea:true,

            shapeOptions:{
                color:'#008000',
                weight:3,
                fillOpacity:0.25
            }
        },

        rectangle:false,
        circle:false,
        circlemarker:false,

        marker:{
            icon:new L.Icon.Default()
        }

    },

    edit:{
        featureGroup:drawnItems,
        remove:true
    }

});

/* ================================================= */
/* ایجاد عارضه */
/* ================================================= */

map.on(
    L.Draw.Event.CREATED,
    function(event){

        var layer=event.layer;

        drawnItems.addLayer(layer);

        layer.bindPopup(
            '<div class="kmz-info">' +
            '<b>عارضه رسم‌شده</b><br>' +
            'برای خروجی KMZ از بخش ابزارها استفاده کنید.' +
            '</div>'
        );

    }
);

/* ================================================= */
/* XML */
/* ================================================= */

function escapeXml(value){

    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&apos;');

}

/* ================================================= */
/* GeoJSON → KML */
/* ================================================= */

function geoJSONToKML(geojson){

    var kml =
        '<?xml version="1.0" encoding="UTF-8"?>' +
        '<kml xmlns="http://www.opengis.net/kml/2.2">' +
        '<Document>' +
        '<name>QGIS Web Map Export</name>';

    var features=geojson.features || [];

    features.forEach(function(feature){

        if(!feature.geometry){
            return;
        }

        var props=feature.properties || {};

        var name =
            props.name ||
            props.Name ||
            props.NAME ||
            'عارضه';

        kml +=
            '<Placemark>' +
            '<name>' +
            escapeXml(name) +
            '</name>';

        var geometry=feature.geometry;

        if(geometry.type==='Point'){

            var c=geometry.coordinates;

            kml +=
                '<Point>' +
                '<coordinates>' +
                c[0]+','+c[1]+',0' +
                '</coordinates>' +
                '</Point>';

        }

        else if(geometry.type==='MultiPoint'){

            geometry.coordinates.forEach(function(c){

                kml +=
                    '<Point>' +
                    '<coordinates>' +
                    c[0]+','+c[1]+',0' +
                    '</coordinates>' +
                    '</Point>';

            });

        }

        else if(geometry.type==='LineString'){

            kml +=
                '<LineString>' +
                '<tessellate>1</tessellate>' +
                '<coordinates>';

            geometry.coordinates.forEach(function(c){

                kml += c[0]+','+c[1]+',0 ';

            });

            kml +=
                '</coordinates>' +
                '</LineString>';

        }

        else if(geometry.type==='MultiLineString'){

            geometry.coordinates.forEach(function(line){

                kml +=
                    '<LineString>' +
                    '<tessellate>1</tessellate>' +
                    '<coordinates>';

                line.forEach(function(c){

                    kml += c[0]+','+c[1]+',0 ';

                });

                kml +=
                    '</coordinates>' +
                    '</LineString>';

            });

        }

        else if(geometry.type==='Polygon'){

            kml +=
                '<Polygon>' +
                '<tessellate>1</tessellate>';

            geometry.coordinates.forEach(
                function(ring,index){

                    kml +=
                        index===0
                        ?
                        '<outerBoundaryIs>'
                        :
                        '<innerBoundaryIs>';

                    kml +=
                        '<LinearRing>' +
                        '<coordinates>';

                    ring.forEach(function(c){

                        kml += c[0]+','+c[1]+',0 ';

                    });

                    kml +=
                        '</coordinates>' +
                        '</LinearRing>' +

                        (
                            index===0
                            ?
                            '</outerBoundaryIs>'
                            :
                            '</innerBoundaryIs>'
                        );

                }
            );

            kml += '</Polygon>';

        }

        else if(geometry.type==='MultiPolygon'){

            geometry.coordinates.forEach(function(polygon){

                kml +=
                    '<Polygon>' +
                    '<tessellate>1</tessellate>';

                polygon.forEach(function(ring,index){

                    kml +=
                        index===0
                        ?
                        '<outerBoundaryIs>'
                        :
                        '<innerBoundaryIs>';

                    kml +=
                        '<LinearRing>' +
                        '<coordinates>';

                    ring.forEach(function(c){

                        kml += c[0]+','+c[1]+',0 ';

                    });

                    kml +=
                        '</coordinates>' +
                        '</LinearRing>' +

                        (
                            index===0
                            ?
                            '</outerBoundaryIs>'
                            :
                            '</innerBoundaryIs>'
                        );

                });

                kml += '</Polygon>';

            });

        }

        kml += '</Placemark>';

    });

    kml +=
        '</Document>' +
        '</kml>';

    return kml;

}

/* ================================================= */
/* ورود KMZ/KML */
/* ================================================= */

function importKMZFile(file){

    if(!file){
        return;
    }

    var fileName=file.name.toLowerCase();

    if(
        !fileName.endsWith('.kmz') &&
        !fileName.endsWith('.kml')
    ){

        alert('لطفاً فایل KMZ یا KML انتخاب کنید.');

        return;
    }

    var reader=new FileReader();

    reader.onload=function(e){

        var arrayBuffer=e.target.result;

        if(fileName.endsWith('.kmz')){

            JSZip.loadAsync(arrayBuffer)

            .then(function(zip){

                var kmlFile=null;

                Object.keys(zip.files).forEach(
                    function(path){

                        if(
                            !zip.files[path].dir &&
                            path.toLowerCase().endsWith('.kml') &&
                            !kmlFile
                        ){

                            kmlFile=zip.files[path];

                        }

                    }
                );

                if(!kmlFile){

                    throw new Error(
                        'فایل KML داخل KMZ پیدا نشد.'
                    );

                }

                return kmlFile.async('text');

            })

            .then(function(kmlText){

                parseKML(
                    kmlText,
                    file.name
                );

            })

            .catch(function(error){

                console.error(error);

                alert(
                    'خطا در خواندن فایل KMZ.'
                );

            });

        }

        else{

            var decoder=new TextDecoder('utf-8');

            var kmlText=decoder.decode(
                new Uint8Array(arrayBuffer)
            );

            parseKML(
                kmlText,
                file.name
            );

        }

    };

    reader.readAsArrayBuffer(file);

}

/* ================================================= */
/* KML → GeoJSON */
/* ================================================= */

function parseKML(kmlText,fileName){

    try{

        var parser=new DOMParser();

        var kml=parser.parseFromString(
            kmlText,
            'text/xml'
        );

        var geojson=toGeoJSON.kml(kml);

        if(
            !geojson ||
            !geojson.features ||
            geojson.features.length===0
        ){

            alert(
                'در فایل KMZ عارضه قابل نمایش پیدا نشد.'
            );

            return;
        }

        kmzLayer.clearLayers();

        kmzLayer.addData(geojson);

        var bounds=kmzLayer.getBounds();

        if(bounds.isValid()){

            map.fitBounds(
                bounds,
                {
                    padding:[40,40]
                }
            );

        }

        alert(
            'فایل ' +
            fileName +
            ' با موفقیت وارد شد.\n' +
            'تعداد عوارض: ' +
            geojson.features.length
        );

    }

    catch(error){

        console.error(error);

        alert(
            'خطا در تبدیل KML به نقشه.'
        );

    }

}

var userMarker=null;
var accuracyCircle=null;
var watchID=null;
var lastPosition=null;

var lastElevationRequest=0;
var currentElevation=null;

/* ================================================= */
/* UTM */
/* ================================================= */

function latLonToUTM(lat,lon){

    var a=6378137.0;
    var eccSquared=0.00669438;
    var k0=0.9996;

    var LongOrigin;
    var eccPrimeSquared;

    var N,T,C,A,M;

    var LatRad=lat*Math.PI/180.0;
    var LongRad=lon*Math.PI/180.0;

    var ZoneNumber=
        Math.floor((lon+180)/6)+1;

    if(
        lat>=56.0 &&
        lat<64.0 &&
        lon>=3.0 &&
        lon<12.0
    ){

        ZoneNumber=32;

    }

    if(
        lat>=72.0 &&
        lat<84.0
    ){

        if(lon>=0 && lon<9){

            ZoneNumber=31;

        }

        else if(lon>=9 && lon<21){

            ZoneNumber=33;

        }

        else if(lon>=21 && lon<33){

            ZoneNumber=35;

        }

        else if(lon>=33 && lon<42){

            ZoneNumber=37;

        }

    }

    LongOrigin=
        (ZoneNumber-1)*6-180+3;

    var LongOriginRad=
        LongOrigin*Math.PI/180.0;

    eccPrimeSquared=
        eccSquared/
        (1-eccSquared);

    N=
        a/
        Math.sqrt(
            1-
            eccSquared*
            Math.sin(LatRad)*
            Math.sin(LatRad)
        );

    T=
        Math.tan(LatRad)*
        Math.tan(LatRad);

    C=
        eccPrimeSquared*
        Math.cos(LatRad)*
        Math.cos(LatRad);

    A=
        Math.cos(LatRad)*
        (
            LongRad-LongOriginRad
        );

    M=
        a*
        (
            (1-eccSquared/4-
             3*eccSquared*eccSquared/64-
             5*eccSquared*eccSquared*eccSquared/256)
            *LatRad

            -

            (3*eccSquared/8+
             3*eccSquared*eccSquared/32+
             45*eccSquared*eccSquared*eccSquared/1024)
            *Math.sin(2*LatRad)

            +

            (15*eccSquared*eccSquared/256+
             45*eccSquared*eccSquared*eccSquared/1024)
            *Math.sin(4*LatRad)

            -

            (35*eccSquared*eccSquared*eccSquared/3072)
            *Math.sin(6*LatRad)
        );

    var UTMEasting=
        (
            k0*N*
            (
                A+
                (1-T+C)*A*A*A/6+
                (5-18*T+T*T+
                 72*C-
                 58*eccPrimeSquared)
                *A*A*A*A*A/120
            )
            +
            500000.0
        );

    var UTMNorthing=
        (
            k0*
            (
                M+
                N*
                Math.tan(LatRad)
                *
                (
                    A*A/2+
                    (5-T+9*C+
                     4*C*C)
                    *A*A*A*A/24+
                    (61-58*T+
                     T*T+
                     600*C-
                     330*eccPrimeSquared)
                    *A*A*A*A*A*A/720
                )
            )
        );

    if(lat<0){

        UTMNorthing+=10000000.0;

    }

    var hemisphere=
        lat>=0
        ?
        'N'
        :
        'S';

    return {

        easting:UTMEasting,

        northing:UTMNorthing,

        zone:ZoneNumber+
             hemisphere

    };

}

/* ================================================= */
/* مختصات */
/* ================================================= */

function updateCoordinateInfo(lat,lon,elevation){

    if(
        typeof lat!=='number' ||
        typeof lon!=='number'
    ){

        return;

    }

    var utm=latLonToUTM(
        lat,
        lon
    );

    document.getElementById(
        'utmE'
    ).textContent=
        utm.easting.toFixed(2);

    document.getElementById(
        'utmN'
    ).textContent=
        utm.northing.toFixed(2);

    document.getElementById(
        'utmZone'
    ).textContent=
        utm.zone;

    if(
        elevation!==null &&
        elevation!==undefined &&
        !isNaN(elevation)
    ){

        document.getElementById(
            'elevation'
        ).textContent=
            Number(elevation).toFixed(1);

    }

}

/* ================================================= */
/* ارتفاع */
/* ================================================= */

function getElevationFromService(lat,lon){

    var now=Date.now();

    if(
        now-lastElevationRequest<30000
    ){

        return;

    }

    lastElevationRequest=now;

    fetch(
        'https://api.open-elevation.com/api/v1/lookup?locations='+
        lat+','+lon
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                'Elevation HTTP '+
                response.status
            );

        }

        return response.json();

    })

    .then(function(data){

        if(
            data &&
            data.results &&
            data.results.length
        ){

            var elevation=
                data.results[0].elevation;

            if(
                elevation!==null &&
                elevation!==undefined
            ){

                currentElevation=
                    Number(elevation);

                updateCoordinateInfo(
                    lat,
                    lon,
                    currentElevation
                );

            }

        }

    })

    .catch(function(error){

        console.log(
            'Elevation error:',
            error
        );

    });

}

/* ================================================= */
/* Bearing */
/* ================================================= */

function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
){

    var dLon=(lon2-lon1)*Math.PI/180;

    var y=
        Math.sin(dLon)*
        Math.cos(lat2*Math.PI/180);

    var x=
        Math.cos(lat1*Math.PI/180)*
        Math.sin(lat2*Math.PI/180)
        -
        Math.sin(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.cos(dLon);

    var bearing=
        Math.atan2(y,x)*
        180/Math.PI;

    return (bearing+360)%360;

}

/* GPS زنده */

function startLiveLocation(){

    if(!navigator.geolocation){

        alert(
            'GPS این دستگاه پشتیبانی نمی‌شود.'
        );

        return;
    }

    watchID=navigator.geolocation.watchPosition(

        function(position){

            var lat=
                position.coords.latitude;

            var lng=
                position.coords.longitude;

            var accuracy=
                position.coords.accuracy;

            var heading=
                position.coords.heading;

            var gpsAltitude=
                position.coords.altitude;

            if(
                gpsAltitude!==null &&
                !isNaN(gpsAltitude)
            ){

                currentElevation=
                    gpsAltitude;

            }

            if(
                gpsAltitude===null ||
                isNaN(gpsAltitude)
            ){

                getElevationFromService(
                    lat,
                    lng
                );

            }

            updateCoordinateInfo(
                lat,
                lng,
                currentElevation
            );

            if(
                (
                    heading===null ||
                    isNaN(heading)
                ) &&
                lastPosition
            ){

                heading=calculateBearing(
                    lastPosition.lat,
                    lastPosition.lng,
                    lat,
                    lng
                );

            }

            if(
                heading===null ||
                isNaN(heading)
            ){

                heading=0;

            }

            if(userMarker){

                userMarker.setLatLng(
                    [lat,lng]
                );

                userMarker.setIcon(
                    createUserIcon(heading)
                );

            }

            else{

                userMarker=L.marker(
                    [lat,lng],
                    {
                        icon:createUserIcon(heading),
                        zIndexOffset:1000
                    }
                ).addTo(map);

                userMarker.bindPopup(
                    '🎯 موقعیت فعلی شما'
                );

            }

            if(accuracyCircle){

                accuracyCircle.setLatLng(
                    [lat,lng]
                );

                accuracyCircle.setRadius(
                    accuracy
                );

            }

            else{

                accuracyCircle=L.circle(
                    [lat,lng],
                    {
                        radius:accuracy,
                        className:'user-accuracy'
                    }
                ).addTo(map);

            }

            map._userLocation=L.latLng(
                lat,
                lng
            );

            if(liveRouteActive){

                updateLiveNavigation();

            }

            lastPosition={
                lat:lat,
                lng:lng
            };

        },

        function(error){

            console.log(
                'GPS Error:',
                error
            );

        },

        {
            enableHighAccuracy:true,
            maximumAge:1000,
            timeout:10000
        }

    );

}

function updateCompassButton(){

    if(!button){
        return;

    button.innerHTML='🧭';

    button.title='جهت جغرافیایی';

    button.setAttribute(
        'data-heading',
        Math.round(compassHeading)
    );

}

function startCompass(){

    if(
        typeof DeviceOrientationEvent !==
        'undefined' &&
        typeof DeviceOrientationEvent.requestPermission ===
        'function'
    ){

        DeviceOrientationEvent
        .requestPermission()

        .then(function(permission){

            if(permission==='granted'){

                window.addEventListener(
                    'deviceorientation',
                    handleOrientation,
                    true
                );

            }

            else{

                alert(
                    'اجازه دسترسی به جهت‌یابی داده نشد.'
                );

            }

        })

        .catch(function(error){

            console.log(error);

        });

    }

    else{

        window.addEventListener(
            'deviceorientationabsolute',
            handleOrientation,
            true
        );

        window.addEventListener(
            'deviceorientation',
            handleOrientation,
            true
        );

    }

}

function handleOrientation(event){

    var heading=null;

    if(
        event.absolute===true &&
        event.alpha!==null
    ){

        heading=
            360-event.alpha;

    }

    if(
        event.webkitCompassHeading!==undefined &&
        event.webkitCompassHeading!==null
    ){

        heading=
            event.webkitCompassHeading;

    }

    if(
        heading===null ||
        isNaN(heading)
    ){

        return;

    }

    compassHeading=
        (heading+360)%360;

    updateCompassButton();

}

/* ================================================= */
/* محاسبه مسیر */
/* ================================================= */

function calculateLiveRoute(firstRoute){

    if(
        !liveRouteActive ||
        !liveDestination ||
        !map._userLocation ||
        isRoutingRequestRunning
    ){

        return;
    }

    var now=Date.now();

    if(
        !firstRoute &&
        now-lastRouteRequestTime<5000
    ){

        return;
    }

    isRoutingRequestRunning=true;

    lastRouteRequestTime=now;

    var start=map._userLocation;

    var end=liveDestination;

    var profile;

    var server;

    if(liveRoutingMode==='driving'){

        profile='driving';

        server=
            'https://routing.openstreetmap.de/routed-car';

    }

    else{

        profile='foot';

        server=
            'https://routing.openstreetmap.de/routed-foot';

    }

    var url=
        server+
        '/route/v1/'+
        profile+'/' +

        start.lng+','+
        start.lat+';'+

        end.lng+','+
        end.lat+

        '?overview=full&geometries=geojson';

    fetch(url)

    .then(function(response){

        if(!response.ok){

            throw new Error(
                'HTTP '+response.status
            );

        }

        return response.json();

    })

    .then(function(data){

        isRoutingRequestRunning=false;

        if(!liveRouteActive){

            return;
        }

        if(
            !data.routes ||
            data.routes.length===0
        ){

            alert(
                'برای این مقصد مسیر پیدا نشد.'
            );

            return;
        }

        var route=data.routes[0];

        if(liveRouteLayer){

            map.removeLayer(
                liveRouteLayer
            );

            liveRouteLayer=null;

        }

        if(routeInfoMarker){

            map.removeLayer(
                routeInfoMarker
            );

            routeInfoMarker=null;

        }

        liveRouteLayer=L.geoJSON(
            route.geometry,
            {
                style:{
                    weight:6,
                    opacity:0.85
                }
            }
        ).addTo(map);

        lastRoutePosition=L.latLng(
            start.lat,
            start.lng
        );

        var distance=route.distance/1000;

        var duration=Math.round(
            route.duration/60
        );

        var modeName=
            liveRoutingMode==='driving'
            ?
            '🚗 خودرو'
            :
            '🚶 پیاده';


        var coordinates=
            route.geometry.coordinates;

        if(
            coordinates &&
            coordinates.length>0
        ){

            var middleIndex=
                Math.floor(
                    coordinates.length/2
                );

            var middleCoordinate=
                coordinates[middleIndex];

            var routeInfoIcon=L.divIcon({

                className:
                    'route-info-label',

                html:

                    '<div class="route-info-box">'+

                    modeName+

                    '<br>'+

                    '📏 '+
                    distance.toFixed(2)+
                    ' km'+

                    ' &nbsp; | &nbsp; '+

                    '⏱ '+
                    duration+
                    ' دقیقه'+

                    '</div>',

                iconSize:[
                    150,
                    58
                ],

                iconAnchor:[
                    75,
                    29
                ]

            });

            routeInfoMarker=L.marker(

                [
                    middleCoordinate[1],
                    middleCoordinate[0]
                ],

                {
                    icon:routeInfoIcon,
                    interactive:false,
                    zIndexOffset:1000
                }

            ).addTo(map);

        }

        if(firstRoute){

            map.fitBounds(
                liveRouteLayer.getBounds(),
                {
                    padding:[50,50]
                }
            );

        }

    })

    .catch(function(error){

        isRoutingRequestRunning=false;

        console.log(
            'Live routing error:',
            error
        );

        alert(
            'خطا در دریافت مسیر.\n' +
            'لطفاً دوباره امتحان کنید.'
        );

    });

}

/* ================================================= */
/* به‌روزرسانی مسیر */
/* ================================================= */

function updateLiveNavigation(){

    if(
        !liveRouteActive ||
        !map._userLocation
    ){

        return;
    }

    if(!lastRoutePosition){

        calculateLiveRoute(false);

        return;
    }

    var current=map._userLocation;

    var distanceMoved=map.distance(
        lastRoutePosition,
        current
    );

    if(distanceMoved>=30){

        calculateLiveRoute(false);

    }

}

/* ================================================= */
/* پایان مسیر */
/* ================================================= */

function stopLiveRoute(){

    liveRouteActive=false;

    liveRoutingMode=null;

    liveDestination=null;

    lastRoutePosition=null;

    isRoutingRequestRunning=false;

    clearCurrentRoute();

}

/* ================================================= */
/* رسم */
/* ================================================= */

function startDrawMarker(){

    new L.Draw.Marker(
        map,
        drawControl.options.draw.marker
    ).enable();

}

function startDrawPolyline(){

    new L.Draw.Polyline(
        map,
        drawControl.options.draw.polyline
    ).enable();

}

function startDrawPolygon(){

    new L.Draw.Polygon(
        map,
        drawControl.options.draw.polygon
    ).enable();

}

function editDrawnFeatures(){

    if(drawnItems.getLayers().length===0){

        alert(
            'عارضه‌ای برای ویرایش وجود ندارد.'
        );

        return;
    }

    new L.EditToolbar.Edit(
        map,
        {
            featureGroup:drawnItems
        }
    ).enable();

}

function deleteDrawnFeatures(){

    if(drawnItems.getLayers().length===0){

        alert(
            'عارضه‌ای برای حذف وجود ندارد.'
        );

        return;
    }

    new L.EditToolbar.Delete(
        map,
        {
            featureGroup:drawnItems
        }
    ).enable();

}

/* ================================================= */
/* کنترل سمت راست */
/* ================================================= */

var mapSideControl=L.control({
    position:'topright'
});

mapSideControl.onAdd=function(){

        '<button '+

        'class="map-side-button" '+
        'title="اندازه‌گیری">'+
        '📏'+
        '</button>';

};

mapSideControl.addTo(map);

/* ================================================= */

document.getElementById(

};

document.getElementById(

/* منوی اصلی */

        /*
           فقط پایان مسیر باقی مانده

        '<button id="stopLiveRouteButton2">'+

        '</button>'+

     

        '</div>'+

        '<button '+
        'id="toolsCategoryButton" '+
        'class="category-button">'+
        '🛠️ ابزارها'+
        '</button>'+

        '<div '+
        'id="toolsSubmenu" '+
        'class="group-submenu">'+

        '<button id="importKMZButton2">'+

        '<button id="exportKMZButton2">'+
        '📤 خروجی KMZ'+

        '<button id="clearKMZButton2">'+
        '🗑️ پاک کردن KMZ'+

        '<button id="drawMarkerButton">'+
        '📍 رسم نقطه'+

        '<button id="drawLineButton">'+

/* ================================================= */
/* توابع منو */
/* ================================================= */

function closeSubmenus(){

    document.querySelectorAll(
        '.group-submenu'
    ).forEach(function(el){

        el.classList.remove('open');

    });

}

document.getElementById(
    'groupMainButton'
).onclick=function(){

    var menu=document.getElementById(
        'groupMenu'
    );

    menu.classList.toggle('open');

};

document.getElementById(
    'locationCategoryButton'
).onclick=function(){

    var submenu=document.getElementById(
        'locationSubmenu'
    );

    var wasOpen=submenu.classList.contains(
        'open'
    );

    closeSubmenus();

    if(!wasOpen){

        submenu.classList.add('open');

    }

};

document.getElementById(
    'toolsCategoryButton'
).onclick=function(){

    var submenu=document.getElementById(
        'toolsSubmenu'
    );

    var wasOpen=submenu.classList.contains(
        'open'
    );

    closeSubmenus();

    if(!wasOpen){

        submenu.classList.add('open');

    }

};

document.getElementById(

        importKMZFile(file);

        e.target.value='';

);
