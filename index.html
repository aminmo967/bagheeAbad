/* ================================================= */
/* حذف ردیف‌های خالی Popup */
/* ================================================= */

function removeEmptyRowsFromPopupContent(
    content,
    feature
){

    var tempDiv =
        document.createElement('div');

    tempDiv.innerHTML =
        content;

    var rows =
        tempDiv.querySelectorAll('tr');

    for(
        var i=0;
        i<rows.length;
        i++
    ){

        var td =
            rows[i].querySelector(
                'td.visible-with-data'
            );

        var key =
            td ? td.id : '';

        if(

            td &&

            td.classList.contains(
                'visible-with-data'
            ) &&

            feature.properties[key] == null

        ){

            rows[i].parentNode.removeChild(rows[i]);

        }

    }

    return tempDiv.innerHTML;

}

/* Lmt1400 */
/* ================================================= */

function pop_Lmt1400_3637_1(
    feature,
    layer
){

    var popupContent =

        '<table>' +

        '<tr><td>' +

        (
            feature.properties['F_Class'] !== null

                String(
                    feature.properties['L_Type']

            ''

/* ================================================= */
/* XML */
/* ================================================= */

function escapeXml(value){

    return String(value)

        .replace(/&/g,'&amp;')

        .replace(/</g,'&lt;')

        .replace(/>/g,'&gt;')

        .replace(/"/g,'&quot;')

        .replace(/'/g,'&apos;');

}


/* ================================================= */
/* GeoJSON → KML */
/* ================================================= */

function geoJSONToKML(
    geojson
){

    var kml =

        '<?xml version="1.0" encoding="UTF-8"?>' +

        '<kml xmlns="http://www.opengis.net/kml/2.2">' +

        '<Document>' +

        '<name>QGIS Web Map Export</name>';


    var features =
        geojson.features || [];


    features.forEach(

        function(feature){

            if(!feature.geometry){

                return;

            }


            var props =
                feature.properties || {};


            var name =
                props.name ||
                props.Name ||
                props.NAME ||
                'عارضه';


            kml +=

                '<Placemark>' +

                '<name>' +

                escapeXml(name) +

                '</name>';


            var geometry =
                feature.geometry;


            if(
                geometry.type === 'Point'
            ){

                var c =
                    geometry.coordinates;

                kml +=

                    '<Point>' +

                    '<coordinates>' +

                    c[0] + ',' +
                    c[1] + ',0' +

                    '</coordinates>' +

                    '</Point>';

            }


            else if(
                geometry.type === 'LineString'
            ){

                kml +=

                    '<LineString>' +

                    '<tessellate>1</tessellate>' +

                    '<coordinates>';


                geometry.coordinates.forEach(

                    function(c){

                        kml +=

                            c[0] + ',' +
                            c[1] + ',0 ';

                    }

                );


                kml +=

                    '</coordinates>' +

                    '</LineString>';

            }


            else if(
                geometry.type === 'Polygon'
            ){

                kml +=

                    '<Polygon>' +

                    '<tessellate>1</tessellate>';


                geometry.coordinates.forEach(

                    function(ring,index){

                        kml +=

                            index === 0

                            ?

                            '<outerBoundaryIs>'

                            :

                            '<innerBoundaryIs>';


                        kml +=

                            '<LinearRing>' +

                            '<coordinates>';


                        ring.forEach(

                            function(c){

                                kml +=

                                    c[0] + ',' +
                                    c[1] + ',0 ';

                            }

                        );


                        kml +=

                            '</coordinates>' +

                            '</LinearRing>' +

                            (

                                index === 0

                                ?

                                '</outerBoundaryIs>'

                                :

                                '</innerBoundaryIs>'

                            );

                    }

                );


                kml +=

                    '</Polygon>';

            }


            kml +=

                '</Placemark>';

        }

    );


    kml +=

        '</Document>' +

        '</kml>';


    return kml;

}


/* ================================================= */
/* ورود KMZ/KML */
/* ================================================= */

function importKMZFile(
    file
){

    if(!file){

        return;

    }


    var fileName =
        file.name.toLowerCase();


    if(

        !fileName.endsWith('.kmz') &&
        !fileName.endsWith('.kml')

    ){

        alert(
            'لطفاً فایل KMZ یا KML انتخاب کنید.'
        );

        return;

    }


    var reader =
        new FileReader();


    reader.onload =
        function(e){

            var arrayBuffer =
                e.target.result;


            if(
                fileName.endsWith('.kmz')
            ){

                JSZip.loadAsync(
                    arrayBuffer
                )

                .then(

                    function(zip){

                        var kmlFile=null;


                        Object.keys(zip.files)
                        .forEach(

                            function(path){

                                if(

                                    !zip.files[path].dir &&
                                    path.toLowerCase()
                                    .endsWith('.kml') &&
                                    !kmlFile

                                ){

                                    kmlFile =
                                        zip.files[path];

                                }

                            }

                        );


                        if(!kmlFile){

                            throw new Error(
                                'فایل KML داخل KMZ پیدا نشد.'
                            );

                        }


                        return kmlFile.async(
                            'text'
                        );

                    }

                )

                .then(

                    function(kmlText){

                        parseKML(
                            kmlText,
                            file.name
                        );

                    }

                )

                .catch(

                    function(error){

                        console.error(error);

                        alert(
                            'خطا در خواندن فایل KMZ.'
                        );

                    }

                );

            }

            else{

                var decoder =
                    new TextDecoder('utf-8');


                var kmlText =
                    decoder.decode(
                        new Uint8Array(
                            arrayBuffer
                        )
                    );


                parseKML(
                    kmlText,
                    file.name
                );

            }

        };


    reader.readAsArrayBuffer(
        file
    );

}


/* ================================================= */
/* KML → GeoJSON */
/* ================================================= */

function parseKML(
    kmlText,
    fileName
){

    try{

        var parser =
            new DOMParser();


        var kml =
            parser.parseFromString(
                kmlText,
                'text/xml'
            );


        var geojson =
            toGeoJSON.kml(kml);


        if(

            !geojson ||
            !geojson.features ||
            geojson.features.length===0

        ){

            alert(
                'در فایل KMZ عارضه قابل نمایش پیدا نشد.'
            );

            return;

        }


        kmzLayer.clearLayers();

        kmzLayer.addData(
            geojson
        );


        var bounds =
            kmzLayer.getBounds();


        if(bounds.isValid()){

            map.fitBounds(

                bounds,

                {

                    padding:[
                        40,
                        40
                    ]

                }

            );

        }


        alert(

            'فایل ' +
            fileName +
            ' با موفقیت وارد شد.\n' +
            'تعداد عوارض: ' +
            geojson.features.length

        );

    }

    catch(error){

        console.error(error);

        alert(
            'خطا در تبدیل KML به نقشه.'
        );

    }

}


/* ================================================= */
/* جمع‌آوری خروجی */
/* ================================================= */

function collectExportGeoJSON(){

    var features=[];


    kmzLayer.eachLayer(

        function(layer){

            if(layer.feature){

                features.push(
                    layer.feature
                );

            }

        }

    );


    drawnItems.eachLayer(

        function(layer){

            var feature =
                layer.toGeoJSON();


            if(feature){

                if(!feature.properties){

                    feature.properties={};

                }


                if(!feature.properties.name){

                    feature.properties.name =
                        'عارضه رسم‌شده';

                }


                features.push(
                    feature
                );

            }

        }

    );


    return {

        type:'FeatureCollection',

        features:features

    };

}


/* ================================================= */
/* خروجی KMZ */
/* ================================================= */

function exportKMZ(){

    var geojson =
        collectExportGeoJSON();


    if(
        geojson.features.length===0
    ){

        alert(
            'هیچ عارضه‌ای برای خروجی وجود ندارد.'
        );

        return;

    }


    var kml =
        geoJSONToKML(
            geojson
        );


    var zip =
        new JSZip();


    zip.file(
        'doc.kml',
        kml
    );


    zip.generateAsync({

        type:'blob',

        mimeType:
            'application/vnd.google-earth.kmz'

    })

    .then(

        function(blob){

            var url =
                URL.createObjectURL(
                    blob
                );


            var a =
                document.createElement(
                    'a'
                );


            a.href=url;

            a.download =
                'QGIS_Web_Map.kmz';


            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);


            setTimeout(

                function(){

                    URL.revokeObjectURL(
                        url
                    );

                },

                1000

            );

        }

    );

}

/* ================================================= */
/* آیکون کاربر */
/* ================================================= */

function createUserIcon(
    heading
){

    var html =

        '<div class="user-location-marker">' +

        '<div class="user-location-arrow" ' +

        'style="transform:rotate(' +

        heading +

        'deg)">' +

        '</div>' +

        '<div class="user-location-dot"></div>' +

        '</div>';


    return L.divIcon({

        className:'',

        html:html,

        iconSize:[32,32],

        iconAnchor:[16,16]

    });

}


/* ================================================= */
/* Bearing */
/* ================================================= */

function calculateBearing(

    lat1,
    lon1,
    lat2,
    lon2

){

    var dLon =
        (lon2-lon1)*Math.PI/180;


    var y =
        Math.sin(dLon) *
        Math.cos(lat2*Math.PI/180);


    var x =

        Math.cos(lat1*Math.PI/180) *
        Math.sin(lat2*Math.PI/180)

        -

        Math.sin(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.cos(dLon);


    var bearing =

        Math.atan2(y,x) *
        180/Math.PI;


    return (bearing+360)%360;

}


/* ================================================= */
/* GPS زنده */
/* ================================================= */

function startLiveLocation(){

    if(!navigator.geolocation){

        alert(
            'GPS این دستگاه پشتیبانی نمی‌شود.'
        );

        return;

    }


    watchID =

        navigator.geolocation.watchPosition(

            function(position){

                var lat =
                    position.coords.latitude;

                var lng =
                    position.coords.longitude;

                var accuracy =
                    position.coords.accuracy;


                var heading =
                    position.coords.heading;


                if(

                    (
                        heading===null ||
                        isNaN(heading)
                    )

                    &&

                    lastPosition

                ){

                    heading =
                        calculateBearing(

                            lastPosition.lat,
                            lastPosition.lng,
                            lat,
                            lng

                        );

                }


                if(
                    heading===null ||
                    isNaN(heading)
                ){

                    heading=0;

                }


                if(userMarker){

                    userMarker.setLatLng(
                        [lat,lng]
                    );

                    userMarker.setIcon(
                        createUserIcon(
                            heading
                        )
                    );

                }

                else{

                    userMarker =

                        L.marker(

                            [lat,lng],

                            {

                                icon:
                                    createUserIcon(
                                        heading
                                    ),

                                zIndexOffset:1000

                            }

                        ).addTo(map);

                    userMarker.bindPopup(
                        '📍 موقعیت فعلی شما'
                    );

                }


                if(accuracyCircle){

                    accuracyCircle.setLatLng(
                        [lat,lng]
                    );

                    accuracyCircle.setRadius(
                        accuracy
                    );

                }

                else{

                    accuracyCircle =

                        L.circle(

                            [lat,lng],

                            {

                                radius:accuracy,

                                className:
                                    'user-accuracy'

                            }

                        ).addTo(map);

                }


                map._userLocation =
                    L.latLng(
                        lat,
                        lng
                    );


                if(liveRouteActive){

                    updateLiveNavigation();

                }


                lastPosition={

                    lat:lat,

                    lng:lng

                };

            },

            function(error){

                console.log(
                    'GPS Error:',
                    error
                );

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );

}


startLiveLocation();

/* ================================================= */
/* مسیریابی زنده */
/* ================================================= */

function startLiveRouting(
    mode
){

    if(!map._userLocation){

        alert(
            'هنوز موقعیت GPS دریافت نشده است.'
        );

        return;

    }


    liveRoutingMode=mode;


    alert(
        'مقصد را روی نقشه انتخاب کنید.'
    );


    map.once(

        'click',

        function(e){

            liveDestination=e.latlng;

            liveRouteActive=true;

            lastRoutePosition=null;


            if(liveDestinationMarker){

                map.removeLayer(
                    liveDestinationMarker
                );

            }


            liveDestinationMarker =

                L.marker(
                    liveDestination
                ).addTo(map);


            liveDestinationMarker.bindPopup(

                mode==='driving'

                ?

                '🏁 مقصد خودرو'

                :

                '🏁 مقصد پیاده'

            );


            calculateLiveRoute(true);

        }

    );

}


/* ================================================= */
/* محاسبه مسیر */
/* ================================================= */

function calculateLiveRoute(
    firstRoute
){

    if(
        !liveRouteActive ||
        !liveDestination ||
        !map._userLocation ||
        isRoutingRequestRunning
    ){

        return;

    }


    var now=Date.now();


    if(

        !firstRoute &&
        now-lastRouteRequestTime<5000

    ){

        return;

    }


    isRoutingRequestRunning=true;

    lastRouteRequestTime=now;


    var start=
        map._userLocation;

    var end=
        liveDestination;


    var profile;

    var server;


    if(
        liveRoutingMode==='driving'
    ){

        profile='driving';

        server=
            'https://routing.openstreetmap.de/routed-car';

    }

    else{

        profile='foot';

        server=
            'https://routing.openstreetmap.de/routed-foot';

    }


    var url=

        server +
        '/route/v1/' +
        profile +
        '/' +

        start.lng + ',' +
        start.lat + ';' +

        end.lng + ',' +
        end.lat +

        '?overview=full&geometries=geojson';


    fetch(url)

    .then(

        function(response){

            if(!response.ok){

                throw new Error(
                    'HTTP '+response.status
                );

            }

            return response.json();

        }

    )

    .then(

        function(data){

            isRoutingRequestRunning=false;


            if(!liveRouteActive){

                return;

            }


            if(
                !data.routes ||
                data.routes.length===0
            ){

                return;

            }


            var route=
                data.routes[0];


            if(liveRouteLayer){

                map.removeLayer(
                    liveRouteLayer
                );

            }


            liveRouteLayer=

                L.geoJSON(

                    route.geometry,

                    {

                        style:{

                            weight:6,

                            opacity:0.85

                        }

                    }

                ).addTo(map);


            lastRoutePosition=

                L.latLng(
                    start.lat,
                    start.lng
                );


            var distance=
                route.distance/1000;


            var duration=
                Math.round(
                    route.duration/60
                );


            var modeName=

                liveRoutingMode==='driving'

                ?

                '🚗 خودرو'

                :

                '🚶 پیاده';


            document
            .getElementById(
                'liveRouteInfo'
            )
            .innerHTML=

                modeName +
                '<br>' +
                '📏 ' +
                distance.toFixed(2) +
                ' کیلومتر' +
                ' &nbsp; | &nbsp; ' +
                '⏱ ' +
                duration +
                ' دقیقه';


            document
            .getElementById(
                'liveRouteInfo'
            )
            .style.display='block';


            if(firstRoute){

                map.fitBounds(

                    liveRouteLayer.getBounds(),

                    {

                        padding:[
                            50,
                            50
                        ]

                    }

                );

            }

        }

    )

    .catch(

        function(error){

            isRoutingRequestRunning=false;

            console.log(
                'Live routing error:',
                error
            );

        }

    );

}


/* ================================================= */
/* به‌روزرسانی مسیر */
/* ================================================= */

function updateLiveNavigation(){

    if(
        !liveRouteActive ||
        !map._userLocation
    ){

        return;

    }


    if(!lastRoutePosition){

        calculateLiveRoute(false);

        return;

    }


    var current=
        map._userLocation;


    var distanceMoved=

        map.distance(
            lastRoutePosition,
            current
        );


    if(distanceMoved>=30){

        calculateLiveRoute(false);

    }

}


/* ================================================= */
/* پایان مسیر */
/* ================================================= */

function stopLiveRoute(){

    liveRouteActive=false;

    liveRoutingMode=null;

    liveDestination=null;

    lastRoutePosition=null;


    if(liveRouteLayer){

        map.removeLayer(
            liveRouteLayer
        );

        liveRouteLayer=null;

    }


    if(liveDestinationMarker){

        map.removeLayer(
            liveDestinationMarker
        );

        liveDestinationMarker=null;

    }


    document
    .getElementById(
        'liveRouteInfo'
    )
    .style.display='none';

}
